<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0000A0">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}</style>
<title>Mars Field Sales Run</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Fredoka:wght@500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap">
<style>
/* Layout: sticky HUD over one active screen (lobby, map, store, overlays). Single bright "game world" theme, set explicitly. */
:root{
  --mars:#0000A0; --mars-2:#2f2fd8; --mars-soft:#e6e7fb;
  --ink:#15163b; --muted:#5d6089; --paper:#f2f3fa; --card:#ffffff; --line:#d8daee;
  --gold:#f2b705; --good:#178a4c; --bad:#cf2e2e; --warn:#d97b00;
  --road:#c9cbe0; --grass:#d9ecd2; --water:#a9cdf0;
  --display:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito Sans','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
*{box-sizing:border-box}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,[data-act]:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;line-height:1.1}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:800;background:var(--mars);color:#fff;box-shadow:0 3px 0 #00005e;transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #00005e}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--card);color:var(--mars);box-shadow:0 0 0 2px var(--mars) inset}
.btn.gold{background:var(--gold);color:#3a2a00;box-shadow:0 3px 0 #a87e00}
.btn.red{background:var(--bad);box-shadow:0 3px 0 #8a1c1c}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:800;background:var(--mars-soft);color:var(--mars)}
.chip.good{background:#dcf3e5;color:var(--good)}.chip.bad{background:#fbe1e1;color:var(--bad)}.chip.warn{background:#fdecd0;color:#8a4d00}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.muted{color:var(--muted)}
.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--mars);color:#fff}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--mars)}
.hud .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:9px}
.hud .logo{background:#fff;border-radius:8px;padding:4px 8px;display:flex}
.hud .logo img{height:16px;display:block}
.hud .title{font-family:var(--display);font-weight:600;font-size:17px;margin-inline-end:auto}
.hud .stat{display:flex;align-items:center;gap:6px;font-weight:800}
.hud .stat small{opacity:.75;font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.hearts{display:flex;gap:3px}
.hearts svg{width:18px;height:18px}
.hud .btn{background:#fff;color:var(--mars);box-shadow:none}

/* screens */
.screen{padding-block:18px 40px}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px}
@media (max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}

/* lobby */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;background:var(--mars);color:#fff;border-radius:22px;padding:26px;position:relative;overflow:hidden}
.hero h1{font-size:clamp(30px,5vw,48px)}
.hero p{max-width:56ch;opacity:.9;margin:.6em 0 0}
.hero .badge{background:#fff;border-radius:16px;padding:14px 18px}
.hero .badge img{width:150px;display:block}
.hero::after{content:"";position:absolute;right:-60px;bottom:-80px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.07)}
@media (max-width:640px){.hero{grid-template-columns:1fr}.hero .badge{justify-self:start}}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}
@media (max-width:700px){.steps{grid-template-columns:1fr}}
.step{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.step b{font-family:var(--display);font-weight:600;font-size:17px;display:block;margin-bottom:4px;color:var(--mars)}
.teamrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.teamrow:first-child{border-top:0}
.dot{width:14px;height:14px;border-radius:50%;flex:none}
.teamrow .nm{font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb{width:100%;border-collapse:collapse;font-size:14px}
.lb th{text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:6px 6px;border-bottom:2px solid var(--line)}
.lb td{padding:8px 6px;border-bottom:1px solid var(--line)}
.lb td.r,.lb th.r{text-align:right}
.lb tr.me td{background:var(--mars-soft)}
.rank{font-family:var(--display);font-weight:700;color:var(--mars);width:28px}
.form{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.form input[type=text]{flex:1 1 180px;min-width:0;border:2px solid var(--line);border-radius:10px;padding:9px 12px;font:inherit;background:#fff;color:var(--ink)}
.swatches{display:flex;gap:6px;align-items:center}
.swatches button{width:26px;height:26px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.swatches button[aria-pressed=true]{box-shadow:0 0 0 3px var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.legend .pk{font-size:11px;font-weight:800;padding:4px 8px;border-radius:6px}

/* map */
.drivebox{position:relative;border-radius:20px;overflow:hidden;border:1px solid var(--line);background:#e9dfc8}
.drivebox canvas{display:block;width:100%;touch-action:none}
#hudc{position:absolute;inset:0;pointer-events:none}
.driveprompt{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;justify-content:center;max-width:calc(100% - 24px)}
.driveprompt .btn{font-size:16px;padding:12px 20px;white-space:nowrap}
.driveprompt kbd{background:rgba(255,255,255,.6);border-color:rgba(0,0,0,.2)}
.driveprompt .chip{font-size:14px;padding:6px 14px}
.hold.wide{width:auto;padding:0 18px;font-size:15px}
.hold.gas{background:var(--mars);color:#fff;box-shadow:none;min-width:90px}
.vanside{background:var(--mars);border-radius:18px 46px 8px 8px;border-top:5px solid var(--gold)}
.vanside .win{position:absolute;right:14px;top:8px;width:34px;height:22px;background:#bcdcf2;border-radius:4px 16px 2px 2px}
.vanside .panel{position:absolute;left:12px;top:10px;width:84px;height:30px;background:#fff;border-radius:6px;display:flex;align-items:center;justify-content:center}
.vanside .panel img{width:70px}
.vanside::after{content:"";position:absolute;left:20px;bottom:-14px;width:28px;height:28px;border-radius:50%;background:#222;box-shadow:88px 0 0 #222}
.rep .hd::before{content:"";position:absolute;left:-4px;top:-3px;width:42px;height:15px;background:var(--mars);border-radius:16px 16px 3px 3px;box-shadow:12px 4px 0 -3px var(--mars)}
.rep .bd::before{content:"MARS";position:absolute;left:0;right:0;top:12px;text-align:center;color:#fff;font:800 10px/1 var(--display);letter-spacing:.06em}
.rep .bd{box-shadow:inset 0 -6px 0 var(--gold)}
.stores{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}
@media (max-width:760px){.stores{grid-template-columns:1fr}}
@media (min-width:761px){.stores{grid-template-columns:repeat(3,minmax(0,1fr))}}
.storecard{display:flex;flex-direction:column;gap:6px}
.storecard h3{font-size:19px}
.storecard .row{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.storecard .btn{margin-top:auto}
.fuelcard{border-color:#17c25c;box-shadow:inset 0 4px 0 #17c25c}
.fuelcard .meter{height:8px}.fuelcard .meter i{background:#17c25c}

/* store stage */
.storehead{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:10px}
.storehead h2{font-size:26px}
.stage{position:relative;height:380px;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#cfd7ea;user-select:none;-webkit-user-select:none;touch-action:pan-y}
.world{position:absolute;top:0;left:0;height:380px;will-change:transform}
.world>*{position:absolute}
.floor{left:0;right:0;top:330px;height:50px}
.wall{left:0;right:0;top:0;height:330px}
.koshk .wall{background:linear-gradient(#bfe3ff 0 70px,#e9d3b3 70px)}
.koshk .floor{background:repeating-linear-gradient(90deg,#b9b4ab 0 58px,#aaa59c 58px 60px)}
.super .wall{background:linear-gradient(#f4f1e6,#e9e4d2)}
.super .floor{background:repeating-linear-gradient(90deg,#e0dccd 0 48px,#d2cdbd 48px 50px)}
.hyper .wall{background:linear-gradient(#e7ecf3,#d9e0ea)}
.hyper .floor{background:repeating-linear-gradient(90deg,#cfd6e0 0 78px,#c2c9d4 78px 80px)}
.awning{background:repeating-linear-gradient(90deg,#d23a2f 0 40px,#fff 40px 80px);border-radius:0 0 14px 14px;box-shadow:0 6px 0 rgba(0,0,0,.08)}
.sign{background:#1f7a46;color:#fff;font-family:var(--display);font-weight:600;font-size:20px;display:flex;align-items:center;justify-content:center;border-radius:8px}
.kiosk-in{background:#5b4a3a;border-radius:6px 6px 0 0}
.fridge{background:#eef3f7;border:4px solid #9fb0bf;border-radius:10px}
.fridge .glass{position:absolute;inset:10px;background:repeating-linear-gradient(180deg,#d7ebf7 0 52px,#9fb0bf 52px 55px);border-radius:4px;opacity:.85}
.counter{background:linear-gradient(#8a5a35,#6e4527);border-radius:8px 8px 0 0;box-shadow:inset 0 6px 0 #a87249}
.super .counter,.hyper .counter{background:linear-gradient(#c9d0dc,#aeb7c6);box-shadow:inset 0 6px 0 #dfe4ec}
.till{background:#2c2f45;border-radius:6px}
.doors{background:linear-gradient(90deg,#bcdcf2 49%,#7d93a8 49% 51%,#bcdcf2 51%);border:6px solid #7d93a8;border-radius:6px 6px 0 0;display:flex;align-items:flex-start;justify-content:center;cursor:pointer}
.doors span,.exit span{background:var(--ink);color:#fff;font-weight:800;font-size:12px;padding:3px 8px;border-radius:6px;margin-top:8px}
.exit{cursor:pointer;display:flex;align-items:flex-start;justify-content:center}
.office{background:#a77b52;border:6px solid #7a5532;border-radius:6px 6px 0 0;color:#fff;font-weight:800;font-size:12px;display:flex;justify-content:center;padding-top:10px}
.lane{background:#2c2f45;border-radius:4px}
.compstand{background:#fff;border:3px solid #c8102e;border-radius:6px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px}
.compstand b{background:#c8102e;color:#fff;font-family:var(--display);font-weight:600;width:100%;text-align:center;border-radius:3px;font-size:14px}
.compstand i{display:block;width:80%;height:30px;background:repeating-linear-gradient(90deg,#c8102e 0 14px,#a80d26 14px 16px);border-radius:3px}
.compstand small{font-size:10px;font-weight:800;color:#c8102e}

.shelf{background:#8c96a8;border-radius:6px;box-shadow:inset 0 0 0 6px #6f7a8e}
.board{position:absolute;left:4px;right:4px;height:6px;background:#5a6478;border-radius:2px}
.pack{position:absolute;width:40px;height:50px;border-radius:4px;display:flex;align-items:flex-end;justify-content:center;padding:2px;cursor:pointer;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18),inset 0 8px 0 rgba(255,255,255,.12);transition:opacity .2s,transform .1s}
.pack span{font-size:8.5px;font-weight:800;line-height:1.05;text-align:center;word-break:break-word}
.pack:hover{transform:translateY(-2px)}
.world.hl .pack:not(.m){opacity:.28}
.world.hl .pack.m{outline:2px solid var(--gold);outline-offset:1px}
.gap{position:absolute;height:50px;border:2px dashed #e7ecf5;border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:2px;cursor:pointer;background:rgba(0,0,0,.12)}
.gap span{font-size:9px;font-weight:800;color:#fff;background:#3b4255;border-radius:3px;padding:0 4px}
.gap em{font-style:normal;font-size:8px;font-weight:800;color:#e7ecf5}
.gap.flag{border-color:var(--bad);background:rgba(207,46,46,.25)}
.gap.flag em{color:#fff;background:var(--bad);border-radius:3px;padding:0 3px;margin-bottom:2px}
.eyetag{position:absolute;right:calc(100% + 4px);font-size:10px;font-weight:800;color:#fff;background:var(--ink);border-radius:5px;padding:2px 6px;white-space:nowrap}
.eyetag.found{background:var(--bad)}
.spot{border:2px dashed var(--mars-2);border-radius:10px;background:rgba(47,47,216,.08);display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;font-size:11px;font-weight:800;color:var(--mars);padding:4px;animation:pulse 2.4s ease-in-out infinite}
.spot b{display:block;font-size:18px;line-height:1}
.spot.placed{border:0;background:none;animation:none;padding:0}
@keyframes pulse{50%{background:rgba(47,47,216,.18)}}
.npc{cursor:pointer}
.bubble{position:absolute;left:50%;transform:translateX(-50%);top:-30px;background:#fff;border:2px solid var(--ink);border-radius:10px;padding:2px 8px;font-size:11px;font-weight:800;white-space:nowrap}
.person{position:absolute;inset:0}
.person .hd{position:absolute;left:50%;top:0;width:34px;height:34px;margin-left:-17px;border-radius:50%;background:#c98d62;box-shadow:inset 0 9px 0 var(--hair,#2b1d14)}
.person .bd{position:absolute;left:50%;top:32px;width:44px;height:48px;margin-left:-22px;border-radius:14px 14px 6px 6px;background:var(--shirt,#fff)}
.person .lg{position:absolute;left:50%;top:78px;width:30px;height:32px;margin-left:-15px;background:linear-gradient(90deg,var(--pants,#2c2f45) 45%,transparent 45% 55%,var(--pants,#2c2f45) 55%)}
.player{width:46px;height:110px;top:220px;z-index:5;pointer-events:none;margin-left:-23px}
.player .bd::after{content:"";position:absolute;right:-8px;top:12px;width:18px;height:24px;background:#222;border:2px solid #555;border-radius:3px}
.player.walk .person{animation:bob .35s ease-in-out infinite}
.player.flip .person{transform:scaleX(-1)}
@keyframes bob{50%{transform:translateY(-3px)}}
.player.flip.walk .person{animation:bobf .35s ease-in-out infinite}
@keyframes bobf{0%,100%{transform:scaleX(-1)}50%{transform:scaleX(-1) translateY(-3px)}}

/* POSM visuals */
.posm{width:100%;height:100%;position:relative}
.p-gondola{background:#fff;border:4px solid var(--mars);border-radius:6px;display:flex;flex-direction:column;gap:5px;padding:5px}
.p-head{background:var(--mars);color:#fff;font-family:var(--display);font-weight:600;font-size:12px;text-align:center;border-radius:3px;padding:2px}
.p-tray{flex:1;display:flex;gap:2px;border-bottom:4px solid #9aa3c9}
.p-tray i{flex:1;border-radius:2px}
.p-stand{background:#fff;border:3px solid var(--mars);border-radius:6px;display:flex;flex-direction:column;gap:4px;padding:4px}
.p-stand img{width:100%;padding:2px 4px}
.p-cdu{background:var(--mars);border-radius:5px;display:flex;flex-direction:column;justify-content:flex-end;padding:3px}
.p-cdu .p-tray{flex:none;height:60%;border:0}
.p-cdu small{color:#fff;font-size:9px;font-weight:800;text-align:center}
.p-strip{background:var(--mars);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;border-radius:4px;height:60%!important;margin-top:auto}
.p-dangler{display:flex;flex-direction:column;align-items:center}
.p-dangler::before{content:"";width:2px;height:24px;background:#555}
.p-dangler div{width:56px;height:56px;border-radius:50%;background:var(--gold);border:3px solid var(--mars);display:flex;align-items:center;justify-content:center;text-align:center;font-size:10px;font-weight:800;color:var(--mars);line-height:1.1;animation:sway 3s ease-in-out infinite;transform-origin:top center}
@keyframes sway{50%{transform:rotate(6deg)}}

.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.controls .sp{flex:1}
.hold{width:54px;height:44px;border-radius:12px;border:0;background:var(--card);box-shadow:0 0 0 2px var(--line) inset;font-size:20px;font-weight:800;color:var(--mars);touch-action:none}
.audit{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
@media (max-width:700px){.audit{grid-template-columns:1fr}}
.audit .card{padding:12px}
.audit .big{font-family:var(--display);font-size:22px;font-weight:600}
.tip{font-size:13px;color:var(--muted);margin-top:8px}
kbd{font-family:inherit;font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:#fff}

/* overlays */
.ov{position:fixed;inset:0;z-index:40;background:rgba(14,15,48,.55);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:calc(20px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.sheet{background:var(--paper);border-radius:20px;width:min(1100px,100%);padding:18px;box-shadow:0 20px 60px rgba(0,0,30,.35)}
.sheet.narrow{width:min(560px,100%)}
.sheethead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.sheethead h2{font-size:24px}
.posmlist{display:grid;gap:8px}
.posmopt{display:flex;align-items:center;gap:12px;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 12px}
.posmopt:hover:not(:disabled){border-color:var(--mars)}
.posmopt:disabled{opacity:.45;cursor:not-allowed}
.posmopt .ic{width:44px;height:52px;flex:none}
.posmopt div{flex:1;min-width:0}
.posmopt b{display:block}
.posmopt small{color:var(--muted)}

/* negotiation */
.nego{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:16px}
@media (max-width:900px){.nego{grid-template-columns:minmax(0,1fr)}}
.owner{display:flex;gap:12px;align-items:center}
.avatar{width:58px;height:58px;border-radius:50%;background:var(--mars);color:#fff;font-family:var(--display);font-weight:600;font-size:22px;display:flex;align-items:center;justify-content:center;flex:none}
.meter{height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--bad),var(--warn),var(--good));transition:width .4s}
.pips{display:flex;gap:4px}
.pips i{width:16px;height:16px;border-radius:4px;background:var(--gold)}
.pips i.off{background:var(--line)}
.chat{display:flex;flex-direction:column;gap:8px;max-height:300px;overflow:auto;padding:4px;margin-top:10px}
.msg{max-width:88%;padding:8px 12px;border-radius:14px;font-size:14px}
.msg.o{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.p{align-self:flex-end;background:var(--mars);color:#fff;border-bottom-right-radius:4px}
.msg.s{align-self:center;background:#fdecd0;color:#6b3d00;font-size:13px;font-weight:700;text-align:center}
.skus{width:100%;border-collapse:collapse;font-size:13px}
.skus td{padding:5px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
.skus .sw{width:12px;height:22px;border-radius:3px;display:inline-block;vertical-align:middle}
.qty{display:flex;align-items:center;gap:4px;justify-content:flex-end}
.qty button{width:28px;height:28px;border-radius:8px;border:0;background:var(--mars-soft);color:var(--mars);font-weight:800}
.qty input{width:46px;text-align:center;border:2px solid var(--line);border-radius:8px;padding:3px;font:inherit;font-weight:800}
.tag{font-size:10px;font-weight:800;border-radius:4px;padding:1px 5px;margin-left:4px}
.tag.oos{background:var(--bad);color:#fff}.tag.fast{background:#dcf3e5;color:var(--good)}

<script>
(function(){
  var cfg=window.FIREBASE_CONFIG, ADMINS=(window.FACILITATOR_EMAILS||[]).map(function(e){return String(e).toLowerCase();});

      };}
  });

      <button class="btn sm" id="langBtn" data-i18n="langBtn">عربي</button>
      <button class="btn sm" id="pauseBtn" hidden data-i18n="pause">Pause &amp; save</button>

<main>
  <section class="screen" id="scrLobby">
    <div class="wrap">
      <div class="hero">
        <div>
          <span class="chip" style="background:rgba(255,255,255,.15);color:#fff" id="eventChip"></span>
          <h1 style="margin-top:10px" data-i18n="title">Field Sales Run</h1>
          <p data-i18n="heroP"></p>
        </div>
        <div class="badge"><img id="heroLogo" alt="Mars"></div>
      </div>
      <div class="steps">
        <div class="step"><b data-i18n="s1t"></b><span data-i18n="s1"></span></div>
        <div class="step"><b data-i18n="s2t"></b><span data-i18n="s2"></span></div>
        <div class="step"><b data-i18n="s3t"></b><span data-i18n="s3"></span></div>
      </div>
      <div class="grid2" style="margin-top:18px">
        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
            <h2 style="font-size:22px" data-i18n="leaderboard"></h2>
            <span style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"><span class="chip" id="lbScenario"></span><button class="btn ghost sm" id="lobbyScreen" data-i18n="projector"></button></span>
          </div>
          <div style="overflow-x:auto;margin-top:8px"><table class="lb" id="lbTable"></table></div>
          <p class="tip" id="lbNote"></p>
        </div>
        <div class="card">
          <h2 style="font-size:22px" data-i18n="yourTeam"></h2>
          <p class="muted" style="margin:.3em 0 0" data-i18n="yourTeamP"></p>
          <div class="form">
            <input type="text" id="teamName" maxlength="28" data-i18n-ph="teamPh">
            <div class="swatches" id="swatches"></div>
            <button class="btn" id="createTeam" data-i18n="startRun"></button>
          </div>
          <div id="teamList" style="margin-top:12px"></div>
          <div class="label" style="margin-top:16px" data-i18n="onShelf"></div>
          <div class="legend" id="legend"></div>
        </div>
      </div>
    </div>
  </section>

  <section class="screen" id="scrMap" hidden>
    <div class="wrap">
      <div class="storehead">
        <div><div class="label" id="mapDayLabel"></div><h2 data-i18n="driveRoute"></h2></div>
        <div class="headbtns">
          <span class="chip" id="targetChip"></span>
          <button class="btn ghost sm" id="camBtn" data-i18n="camChase"></button>
          <button class="btn ghost sm" id="sndBtn" aria-pressed="false" data-i18n="sndOff"></button>
          <button class="btn ghost sm" id="endDayBtn" data-i18n="endDay"></button>
        </div>
      </div>
      <div class="drivebox"><canvas id="drive" aria-label="Mars van driving view"></canvas><canvas id="hudc" aria-hidden="true"></canvas><div id="drivePrompt" class="driveprompt"></div>
        <div class="touchpad">
          <div><button class="tpb" id="dLeft" data-i18n-al="steerL">&#9664;</button><button class="tpb" id="dRight" data-i18n-al="steerR">&#9654;</button></div>
          <div><button class="tpb brk" id="dBrake" data-i18n="brake"></button><button class="tpb gas" id="dGas" data-i18n="gas"></button></div>
        </div>
      </div>
      <p class="kbdhint muted" data-i18n="kbdHint"></p>
      <div id="mapExtras"></div>
      <div class="stores" id="storeCards"></div>
    </div>
  </section>

  <section class="screen" id="scrStore" hidden>
    <div class="wrap">
      <div class="storehead">
        <div><div class="label" id="stKind"></div><h2 id="stName"></h2></div>
        <div class="headbtns">
          <button class="btn ghost sm" id="dataBtn" data-i18n="storeData"></button>
          <button class="btn ghost sm" id="planoBtn" data-i18n="plano"></button>
          <button class="btn ghost sm" id="hlBtn" aria-pressed="false" data-i18n="hl"></button>
          <button class="btn sm" id="talkBtn" data-i18n="talk"></button>
        </div>
      </div>
      <div class="stage" id="stage"><div class="world" id="world"></div></div>
      <div class="controls">
        <button class="hold" id="leftBtn" data-i18n-al="walkL">&#9664;</button>
        <button class="hold" id="rightBtn" data-i18n-al="walkR">&#9654;</button>
        <span class="muted" style="font-size:13px" data-i18n="tapHint"></span>
        <span class="sp"></span>
        <button class="btn ghost sm" id="leaveBtn" data-i18n="backCar"></button>
      </div>
      <div class="audit" id="audit"></div>
    </div>
  </section>

  <section class="screen" id="scrAdmin" hidden>
    <div class="wrap">
      <div class="storehead">
        <div><div class="label" data-i18n="backend"></div><h2 data-i18n="ctrlRoom"></h2></div>
        <button class="btn ghost sm" id="admBack" data-i18n="backGame"></button>
      </div>
      <div class="tabs" id="admTabs" role="tablist"></div>
      <div id="admBody"></div>
      <div class="savebar" id="admSave" hidden><span id="admSaveMsg"></span><button class="btn gold sm" id="admSaveBtn" data-i18n="saveScen"></button></div>
    </div>
  </section>
  <section class="screen" id="scrScreen" hidden><div id="screenBody"></div></section>
</main>

function deepMerge(base,over){if(!over||typeof over!=='object')return JSON.parse(JSON.stringify(base));const o=Array.isArray(base)?[...base]:{...base};for(const k of Object.keys(over)){const b=base?base[k]:undefined,v=over[k];o[k]=(b&&typeof b==='object'&&!Array.isArray(b)&&v&&typeof v==='object')?deepMerge(b,v):v;}return o;}

/* ---------- game state ---------- */
function newGame(){const s=S();return{day:1,lives:s.lives,money:s.startMoney,car:null,odo:0,earned:0,deals:0,dayEarn:0,dayStart:s.startMoney,clock:s.dayStart*60,fuel:s.tank,visits:newVisits(),over:false,history:[],stats:{},dayLog:{cartons:{},stores:{}}};}
function newVisits(){const v={};for(const t of TYPES)v[t]=newVisit(t);return v;}
function newVisit(t){
  const st=ST(t),fast=list(st.fast);
  const pool=fast.length>=2?fast:SKUS.slice(0,3).map(s=>s.id);
  const need=Math.min(2,pool.length),oos=[];
  while(oos.length<need){const p=pick(pool);if(!oos.includes(p))oos.push(p);}
  const v={status:'open',oos,oosFound:[],eyeIssue:Math.random()<st.eyeChance,eyeFound:false,spots:{},nego:null,shelf:null,earned:0,coach:null,plano:null};
  v.shelf=genShelf(t,v);v.data=genData(t,v);return v;
}
function genShelf(t,v){
  const st=ST(t),cols=LAYOUT[LT(t)].shelf.cols,rows=4,avoid=list(st.avoid);
  let marsPool=SKUS.map(s=>s.id).filter(id=>!v.oos.includes(id)&&!avoid.includes(id));
  if(!marsPool.length)marsPool=SKUS.map(s=>s.id).filter(id=>!v.oos.includes(id));
  if(!marsPool.length)marsPool=SKUS.map(s=>s.id);
  const compPool=COMP.length?COMP.map(c=>c.id):marsPool;
  const fastIn=list(st.fast).filter(x=>marsPool.includes(x));
  const g=[];
  for(let r=0;r<rows;r++){
    const row=[];
    while(row.length<cols){
      let id;
      if(r===1&&v.eyeIssue)id=pick(compPool.slice(0,Math.min(4,compPool.length)));
      else if(r===1)id=pick(fastIn.length?fastIn:marsPool);
      else id=Math.random()<st.marsShare?pick(marsPool):pick(compPool);
      const n=2+(Math.random()<.4?1:0);
      for(let i=0;i<n&&row.length<cols;i++)row.push(id);
    }
    g.push(row);
  }
  const used=new Set();
  for(const sku of v.oos){
    let r,c,guard=0;
    do{r=pick([0,2,3]);c=2*Math.floor(Math.random()*(cols/2));guard++;}while(used.has(r+'-'+c)&&guard<50);
    used.add(r+'-'+c);g[r][c]='gap:'+sku;g[r][c+1]='gap2';
  }
  return g;
}

function placePosm(sp,type){
  const cost=S().posmCost[type],v=G.visits[CUR];

function maxDisc(gross){const p=S().policy;return gross<p.t1?p.d1:gross<p.t2?p.d2:p.d3;}
function calc(n){
  let gross=0,cartons=0;
  for(const s of SKUS){const q=n.qty[s.id]||0;gross+=q*priceOf(s);cartons+=q;}
  const freeC=n.free?Math.floor(cartons/6):0,freeCost=cartons?freeC*gross/cartons:0,disc=gross*n.disc/100;
  const net=gross-disc-freeCost;
  return{gross,cartons,freeC,freeCost,disc,net,comm:net*S().commission/100};
}
function openNego(){
  const t=CUR,st=ST(t),v=G.visits[t];
  if(v.status!=='open')return;
  if(!v.nego){
    const ly=LT(t),bank=(S().objections||[]).filter(o=>list2(o.layouts||'koshk,super,hyper').includes(ly)&&(o.answers||[]).length);
    const q=[];const pool=bank.slice();while(q.length<2&&pool.length){q.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0].id);}
    v.nego={qty:{},disc:0,free:false,terms:0,patience:maxPatience(t),log:[{w:'o',k:'open'}],offers:0,obj:{queue:q,cur:null,ans:[]}};
    const s=prepNote(v);if(s)v.nego.log.push({w:'o',keys:s});
    nextObjection(v.nego);
  }
  if(!v.nego.obj)v.nego.obj={queue:[],cur:null,ans:[]};
  renderNego();
}
function prepNote(v){
  const k=[];const placed=Object.values(v.spots);
  if(placed.some(p=>p.grade==='best'))k.push('prepGood');
  if(placed.some(p=>p.grade==='bad'))k.push('prepBad');
  if(v.oosFound.length)k.push('prepShelf');
  if(v.plano!=null&&v.plano>=70)k.push('prepPlano');
  return k.length?k:null;
}

function renderNegoKeep(){const sc=$('#overlay').scrollTop;const fid=document.activeElement&&document.activeElement.id;renderNego();$('#overlay').scrollTop=sc;if(fid&&document.getElementById(fid))document.getElementById(fid).focus({preventScroll:true});}
function evaluate(n,v,t){
  const st=ST(t),c=calc(n),f=[],ly=LT(t),want=wantDisc(t),pers=st.persona||'balanced';
  if(c.gross<st.min)f.push({k:'low',p:ly==='koshk'?0:ly==='super'?-1:-2,m:2});
  else if(c.gross>st.max)f.push({k:'high',p:-2,m:2});
  else f.push({k:'low',p:2,m:2});
  const dm=pers==='price'?3:2;f.push({k:'disc',p:n.disc>=want?dm:n.disc>0?1:0,m:dm});
  f.push({k:'terms',p:n.terms>=st.wantTerms?1:(ly==='hyper'?-1:0),m:1});
  if(st.likesFree)f.push({k:'free',p:n.free?1:0,m:1});
  const fast=list(st.fast),fc=fast.filter(id=>n.qty[id]>0).length;
  f.push({k:'fast',p:fc>=Math.min(2,fast.length||2)?1:0,m:1});
  const avoid=list(st.avoid);if(avoid.some(id=>n.qty[id]>0))f.push({k:'avoid',p:-1,m:0});
  const inc=v.oos.filter(id=>n.qty[id]>0).length,miss=v.oos.find(id=>!(n.qty[id]>0));
  f.push({k:'oos',p:inc,m:v.oos.length,sku:miss||''});
  const fr=fitRatio(n,t);f.push({k:'fit',p:fr.r<=.3?2:fr.r<=.6?1:fr.over?-1:0,m:2});
  const placed=Object.values(v.spots);
  f.push({k:'prep',p:(placed.some(p=>p.grade==='best')?1:0)-(placed.some(p=>p.grade==='bad')?1:0),m:1});
  if(v.eyeIssue)f.push({k:'eye',p:v.eyeFound?1:0,m:1});
  if(v.plano!=null)f.push({k:'plano',p:v.plano>=70?1:0,m:0});
  if(st.needsGondola)f.push({k:'gondola',p:placed.some(p=>p.type==='gondola')?0:-1,m:0});
  if(n.obj&&n.obj.ans.length){const sum=n.obj.ans.reduce((a,b)=>a+b.score,0),rm=pers==='relationship'?3:2;f.push({k:'rapport',p:clamp(Math.round(sum*(pers==='relationship'?1.5:1)),-2,rm),m:rm});}
  const total=f.reduce((a,b)=>a+b.p,0),need=needPts(t);
  const gaps=f.filter(x=>x.m-x.p>0&&ownerLine(t,x.k)).sort((a,b)=>(b.m-b.p)-(a.m-a.p)||PRIORITY.indexOf(a.k)-PRIORITY.indexOf(b.k));
  return{total,ok:total>=need,need,top:gaps[0],c,f,fit:fr};
}
function policyBreach(n,t){
  const st=ST(t),c=calc(n),p=S().policy;
  if(n.disc>maxDisc(c.gross))return{tk:'brDisc',tv:{d:n.disc,m:maxDisc(c.gross),g:egp(c.gross)}};
  if(n.terms>st.maxTerms)return{tk:'brTerms',tv:{t:termName(n.terms)}};
  if(n.free&&n.disc>p.freeStack)return{tk:'brFree',tv:{x:p.freeStack}};
  return null;
}
function makeOffer(){
  const t=CUR,st=ST(t),v=G.visits[t],n=v.nego,c=calc(n);
  if(n.obj&&n.obj.cur){toast(tr('answerFirst'),'warn');return;}
  if(!c.cartons){toast(tr('addCarton'),'warn');return;}
  n.log.push({w:'p',tk:'offer',tv:{c:c.cartons,g:egp(c.gross),d:n.disc,t:termName(n.terms),f:n.free?tr('offerFree'):''}});
  n.offers++;stat('offers');addTime(st.persona==='busy'?9:6);
  const br=policyBreach(n,t);
  if(br){
    G.lives--;n.patience--;stat('breaches');
    n.log.push({w:'s',tk:'amBlock',tv:{x:tr(br.tk,br.tv)}});
    toast(tr('breachToast'),'bad');renderHud();
    if(G.lives<=0){save(true);return gameOver();}
    if(n.patience<=0)return walkout();
    save();return renderNegoKeep();
  }
  const ev=evaluate(n,v,t);n.lastInterest=clamp(ev.total/ev.need,0,1);
  if(ev.ok)return closeDeal(ev);
  n.patience--;stat('rejected');
  n.log.push(ev.top?{w:'o',k:ev.top.k,sku:ev.top.sku||''}:{w:'o',tk:'notGood'});
  if(n.patience<=0)return walkout();
  nextObjection(n);
  save();renderNegoKeep();
}
function coaching(v,t,n){
  const L_=LAYOUT[LT(t)],out=[];
  const missed=v.oos.filter(x=>!v.oosFound.includes(x)).map(x=>pShort(prodOf(x))).join(LANG==='ar'?'، ':', ');
  out.push({k:missed?'bad':'good',tk:missed?'cOosMiss':'cOos',tv:{f:v.oosFound.length,n:v.oos.length,x:missed}});
  if(v.eyeIssue)out.push({k:v.eyeFound?'good':'bad',tk:v.eyeFound?'cEyeYes':'cEyeNo'});
  for(const sp of L_.spots){const p=v.spots[sp.id];
    if(!p){out.push({k:'warn',tk:'cUnused',spot:sp.id});continue;}
    out.push({k:p.grade==='best'?'good':p.grade==='ok'?'warn':'bad',tk:p.grade==='best'?'cBest':p.grade==='ok'?'cOk':'cBad',spot:sp.id,posm:p.type});}
  if(n&&n.offers){const fr=fitRatio(n,t);out.push({k:fr.r<=.3?'good':'bad',tk:fr.r<=.3?'cFitGood':'cFitBad'});out.push({k:'warn',tk:'idealOrder'});out.push({k:'warn',tk:'cExpect'});}
  if(n&&n.obj)for(const a of n.obj.ans){out.push({k:a.score>0?'good':a.score<0?'bad':'warn',obfb:a.id,score:a.score});}
  return out;
}
function closeDeal(ev){
  const t=CUR,v=G.visits[t],n=v.nego,s=S();
  const audit=s.auditBonus*(v.oosFound.length+(v.eyeFound?1:0));
  const comm=Math.round(ev.c.comm);
  v.status='won';v.earned=comm+audit;G.money+=comm+audit;G.earned+=comm+audit;G.deals++;
  n.log.push({w:'o',k:'accept'});
  v.coach=coaching(v,t,n);
  stat('won');stat('discGiven',n.disc);stat('discWant',wantDisc(t));stat('fitSum',Math.round(100*(1-Math.min(1,ev.fit.r))));stat('fitN');storeOutcomeStats(v);
  G.dayLog=G.dayLog||{cartons:{},stores:{}};for(const p of SKUS){const q=n.qty[p.id]||0;if(q>0){G.dayLog.cartons[p.id]=(G.dayLog.cartons[p.id]||0)+q;(G.dayLog.stores[p.id]=G.dayLog.stores[p.id]||[]).includes(t)||G.dayLog.stores[p.id].push(t);}}
  G.history.push({day:G.day,store:t,result:'won',net:Math.round(ev.c.net),earned:v.earned});
  save(true);renderHud();
  showResult(true,t,{net:ev.c.net,comm,audit});
}
function walkout(){

  G.history.push({day:G.day,store:t,result:'lost'});

}

function prodOf(id){return SK[id]||CP[id]||{short:id,name:id,co:'?',bg:'#9aa0b5',fg:'#fff'};}
function msgText(m,t){
  if(m.ob){const o=findObj(m.ob);return o?L(o,'text'):'';}
  if(m.oa){const o=findObj(m.oa[0]),a=o&&o.answers[m.oa[1]];return a?L(a,'text'):'';}
  if(m.ofb){const o=findObj(m.ofb[0]),a=o&&o.answers[m.ofb[1]];return a?(tr(+a.score>0?'rapportGood':+a.score<0?'rapportBad':'okAnswer')+': '+L(a,'fb')):'';}
  if(m.k)return ownerLine(t,m.k).replace('{sku}',m.sku?pShort(prodOf(m.sku)):tr('thatProduct'))||tr('notGood');
  if(m.keys)return m.keys.map(k=>tr(k)).join(' ');
  if(m.tk)return tr(m.tk,m.tv||{});
  return m.t||'';
}
function coachText(c,t){
  const st=ST(t),sp=c.spot?LAYOUT[LT(t)].spots.find(s=>s.id===c.spot):null;
  if(c.t&&!c.tk&&!c.obfb)return c.t;
  if(c.obfb){const o=findObj(c.obfb);if(!o)return '';const a=o.answers.find(x=>(+x.score||0)===c.score)||o.answers[0];return '“'+L(o,'text')+'” → '+L(a,'fb');}
  const v=Object.assign({},c.tv||{});
  if(sp){v.s=spLabel(sp);v.b=sp.best.map(b=>posmName(b)).join(' / ');v.tip=spTip(sp);if(c.posm)v.p=posmName(c.posm);}
  if(c.tk==='cExpect')Object.assign(v,{o:stOwner(t),d:wantDisc(t),t:termName(st.wantTerms),a:egp(st.min),b:egp(st.max)});
  if(c.tk==='idealOrder'){const d=vdata(t);v.x=SKUS.filter(p=>d[p.id].ideal>0).map(p=>d[p.id].ideal+'× '+pShort(p)).join(LANG==='ar'?'، ':', ')||'—';}
  return tr(c.tk,v);
}

function npcXY(n){const lane=WORLD.rw*.45;return n.axis==='h'?[n.pos,n.line+n.dir*lane]:[n.line-n.dir*lane,n.pos];}
function updateNPCs(dt){
  for(const n of NPCS){
    const [x,y]=npcXY(n);let target=n.cruise;
    const fx=n.axis==='h'?n.dir:0,fy=n.axis==='v'?n.dir:0;
    const ahead=(ox,oy)=>{const dx=ox-x,dy=oy-y,along=dx*fx+dy*fy,side=Math.abs(dx*fy-dy*fx);return along>0&&along<80&&side<22;};
    if(CAR&&ahead(CAR.x,CAR.y))target=0;
    for(const m of NPCS){if(m!==n){const p=npcXY(m);if(ahead(p[0],p[1])){target=Math.min(target,m.spd*.9);}}}
    if(Math.abs((n.axis==='h'?x:y)-(n.axis==='h'?CHECK.x:CHECK.y))<90&&(n.axis==='h'?n.line===CHECK.y:false))target=Math.min(target,35);
    n.spd+=clamp(target-n.spd,-260*dt,90*dt);
    const len=n.axis==='h'?WORLD.W:WORLD.H;n.pos=(n.pos+n.dir*n.spd*dt+len)%len;
  }
}

  oos:rate(s.oosFound||0,s.oosTotal||0),eye:rate(s.eyeFound||0,s.eyeTotal||0),
  posm:[s.posmBest||0,s.posmOk||0,s.posmBad||0],obj:[s.objGood||0,s.objNeutral||0,s.objBad||0],
  objScore:((s.objGood||0)+(s.objNeutral||0)+(s.objBad||0))?Math.round(100*((s.objGood||0)-(s.objBad||0)*.5)/((s.objGood||0)+(s.objNeutral||0)+(s.objBad||0))):null,
  fit:s.fitN?Math.round(s.fitSum/s.fitN):null,plano:s.planoN?Math.round(s.planoSum/s.planoN):null,fines:s.fines||0,objMet:s.objMet||0};}
function teamNotes(m){const st=[],gp=[];
  const check=m.oos!=null?(m.oos+(m.eye??m.oos))/2:null;
  if(check!=null&&check>=75)st.push('sStore');if(check!=null&&check<50)gp.push('gStore');
  if(m.disc!=null&&+m.disc<=+m.want)st.push('sDisc');if(m.disc!=null&&+m.disc>+m.want+1)gp.push('gDisc');
  if(m.objScore!=null&&m.objScore>=60)st.push('sObj');if(m.objScore!=null&&m.objScore<30)gp.push('gObj');
  if(m.fit!=null&&m.fit>=70)st.push('sFit');if(m.fit!=null&&m.fit<45)gp.push('gFit');
  if(m.won>=2&&m.won>m.lost)st.push('sWin');if(m.breach>0)gp.push('gBreach');if(m.posm[2]>m.posm[0])gp.push('gPosm');
  return{st,gp};}
function awardsFor(list){const ok=x=>x.length?x:null;
  const top=[...list].sort((a,b)=>(b.money||0)-(a.money||0))[0];
  const negs=ok(list.filter(t=>(t.stats||{}).won>=1));const neg=negs&&negs.sort((a,b)=>{const A=teamMetrics(a),B=teamMetrics(b);return (B.won/(B.won+B.lost))-(A.won/(A.won+A.lost))||(B.objScore||0)-(A.objScore||0);})[0];
  const chks=ok(list.filter(t=>(t.stats||{}).oosTotal>0));const chk=chks&&chks.sort((a,b)=>{const A=teamMetrics(a),B=teamMetrics(b);return ((B.oos||0)+(B.eye||0))-((A.oos||0)+(A.eye||0));})[0];
  const ds=ok(list.filter(t=>(t.stats||{}).won>=1));const disc=ds&&ds.sort((a,b)=>{const A=teamMetrics(a),B=teamMetrics(b);return ((+A.disc)-(+A.want)+A.breach*2)-((+B.disc)-(+B.want)+B.breach*2);})[0];
  return[['awTop',top],['awNeg',neg],['awCheck',chk],['awDisc',disc]];}
function renderDebrief(){
  const list=[...TEAMS].sort((a,b)=>(b.money||0)-(a.money||0));
  const tot={};for(const t of list){const s=t.stats||{};for(const k in s)tot[k]=(tot[k]||0)+s[k];}
  const cm=teamMetrics({stats:tot}),cn=teamNotes(cm);
  const row=(l,v)=>`<div class="mrow"><span>${l}</span><b class="num">${v}</b></div>`;
  const card=(name,m,notes,color)=>`<div class="teamcard"><div class="tc-head">${color?`<span class="dot" style="background:${esc(color)}"></span>`:''}<b>${esc(name)}</b></div>
    ${row(tr('dWin'),m.won)}${row(tr('dLost'),m.lost)}${row(tr('dBreach'),m.breach)}${row(tr('dDisc'),m.disc!=null?m.disc+'% / '+m.want+'%':'—')}
    ${row(tr('dOos'),m.oos!=null?m.oos+'%':'—')}${row(tr('dEye'),m.eye!=null?m.eye+'%':'—')}${row(tr('dPosm'),m.posm.join(' / '))}${row(tr('dObj'),m.obj.join(' / '))}
    ${row(tr('dFit'),m.fit!=null?m.fit+'%':'—')}${row(tr('dPlano'),m.plano!=null?m.plano:'—')}${row(tr('dFines'),m.fines)}
    ${notes.st.length?`<div class="label" style="margin-top:6px;color:var(--good)">${tr('strengths')}</div><div class="chips">${notes.st.map(k=>`<span class="chip good">${tr(k)}</span>`).join('')}</div>`:''}
    ${notes.gp.length?`<div class="label" style="margin-top:6px;color:var(--bad)">${tr('gaps')}</div><div class="chips">${notes.gp.map(k=>`<span class="chip bad">${tr(k)}</span>`).join('')}</div>`:''}</div>`;
  $('#admBody').innerHTML=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><h3 style="font-size:20px">${tr('tDebrief')}</h3><button class="btn gold sm" id="openScreen">${tr('projector')}</button></div>
   <div class="teamcards">${card(tr('classView'),cm,cn)}${list.map(t=>{const m=teamMetrics(t);return card(t.name,m,teamNotes(m),t.color);}).join('')}</div></div>`;
}
let SCREEN_TIMER=null;
function openScreen(){show('scrScreen');document.body.classList.add('screenmode');renderScreen();clearInterval(SCREEN_TIMER);SCREEN_TIMER=setInterval(renderScreen,4000);try{document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().catch(()=>{});}catch(e){}}
function closeScreen(){clearInterval(SCREEN_TIMER);document.body.classList.remove('screenmode');try{document.fullscreenElement&&document.exitFullscreen();}catch(e){}if(isAdmin){openAdmin();}else{renderLobby();show('scrLobby');}}
function renderScreen(){
  if($('#scrScreen').hidden)return;
  const list=[...TEAMS].sort((a,b)=>(b.money||0)-(a.money||0)||(b.deals||0)-(a.deals||0));
  const pod=[list[1],list[0],list[2]];
  $('#screenBody').innerHTML=`<div class="scr-head"><img src="${LOGO}" alt="Mars"><h1>${tr('title')}</h1><span>${esc(EVENT.message||tr('liveBoard'))}</span></div>
   <div class="podium">${pod.map((t,i)=>t?`<div class="pod p${[2,1,3][i]}"><div class="pname"><span class="dot" style="background:${esc(t.color||'#fff')}"></span>${esc(t.name)}</div><div class="pmoney num">${egp(t.money||0)}</div><div class="pblock">${[2,1,3][i]}</div></div>`:'<div class="pod empty"></div>').join('')}</div>
   <div class="scr-grid"><div class="scr-list">${list.slice(3,12).map((t,i)=>`<div class="srow"><span class="num">${i+4}</span><span class="dot" style="background:${esc(t.color||'#fff')}"></span><b>${esc(t.name)}</b><span class="num">${tr('day')} ${t.day||1}</span><span class="num">${egp(t.money||0)}</span></div>`).join('')}</div>
   <div class="scr-awards"><h2>${tr('awards')}</h2>${awardsFor(list).map(([k,t])=>`<div class="aw"><span>${tr(k)}</span><b>${t?esc(t.name):tr('awNone')}</b></div>`).join('')}</div></div>
   <button class="btn ghost sm scr-exit" id="exitScreen">${tr('exitScreen')}</button>`;
}
document.addEventListener('click',e=>{if(e.target.id==='exitScreen')closeScreen();if(e.target.id==='openScreen'||e.target.id==='lobbyScreen'){subTeams(true);openScreen();}});
/* ---------- backend editors (v2) ---------- */
function selFld(path,label,val,opts,cls=''){const id='a-'+path.replace(/\./g,'-');return `<div class="field ${cls}"><label for="${id}">${esc(label)}</label><select id="${id}" data-f="${path}" data-t="${typeof opts[0][0]==='number'?'num':'text'}">${opts.map(([v,l])=>`<option value="${esc(v)}" ${String(v)===String(val)?'selected':''}>${esc(l)}</option>`).join('')}</select></div>`;}



$('#scrAdmin').addEventListener('click',e=>{
  const t=e.target,d=ADM.draft;if(!d)return;
  if(t.id==='addObj'){d.objections.push({id:'o'+Math.random().toString(36).slice(2,7),layouts:'koshk,super,hyper',text:'',text_ar:'',answers:[{text:'',text_ar:'',score:1,fb:'',fb_ar:''},{text:'',text_ar:'',score:0,fb:'',fb_ar:''},{text:'',text_ar:'',score:-1,fb:'',fb_ar:''}]});markDirty();rerenderScen();return;}
  const dobj=t.closest('[data-delobj]');if(dobj){d.objections.splice(+dobj.dataset.delobj,1);markDirty();rerenderScen();return;}
  const aa=t.closest('[data-addans]');if(aa){d.objections[+aa.dataset.addans].answers.push({text:'',text_ar:'',score:0,fb:'',fb_ar:''});markDirty();rerenderScen();return;}
  const da=t.closest('[data-delans]');if(da){const [i,j]=da.dataset.delans.split('.').map(Number);d.objections[i].answers.splice(j,1);markDirty();rerenderScen();return;}
  const oc=t.closest('[data-ochip]');if(oc){const o=d.objections[+oc.dataset.ochip],cur=list2(o.layouts),k=oc.dataset.ly;const nx=cur.includes(k)?cur.filter(x=>x!==k):[...cur,k];o.layouts=nx.join(',');oc.setAttribute('aria-pressed',!cur.includes(k));markDirty();return;}
  if(t.id==='addGoal'){d.objectives.push({id:'g'+Math.random().toString(36).slice(2,7),type:'cartons',sku:d.products[0].id,target:5,bonus:150});markDirty();rerenderScen();return;}
  const dg=t.closest('[data-delgoal]');if(dg){d.objectives.splice(+dg.dataset.delgoal,1);markDirty();rerenderScen();return;}
},true);
/* ---------- boot ---------- */
$('#langBtn').addEventListener('click',()=>setLang(LANG==='ar'?'en':'ar'));
applyLang();renderLobby();renderHud();
initBackend().then(()=>{if(location.hash==='#admin'&&isAdmin)openAdmin();if(location.hash==='#screen')openScreen();});
