<body>
<header class="hud" id="hud">
  <div class="wrap">
    <span class="logo"><img id="hudLogo" alt="Mars"></span>
    <span class="title" data-i18n="title">Field Sales Run</span>
    <span class="stat" id="hudTeam" hidden></span>
    <span class="stat" id="hudDay" hidden><small data-i18n="day">Day</small><span class="num" id="dayN">1</span></span>
    <span class="stat" id="hudClock" hidden><small data-i18n="clock">Time</small><span class="num" id="clockT">09:00</span></span>
    <span class="stat" id="hudLives" hidden><small data-i18n="lives">Lives</small><span class="hearts" id="hearts"></span></span>
    <span class="stat" id="hudMoney" hidden><small data-i18n="wallet">Wallet</small><span class="num" id="money">EGP 0</span></span>
    <button class="btn sm hb-ic" id="fsBtn" hidden></button>
    <button class="btn sm hb-ic" id="menuBtn" aria-expanded="false" aria-label="Menu"></button>
    <span class="hudbtns" id="hudMenu">
      <button class="btn sm" id="langBtn" data-i18n="langBtn">عربي</button>
      <button class="btn sm" id="pauseBtn" hidden data-i18n="pause">Pause &amp; save</button>
      <button class="btn sm" id="adminBtn" hidden data-i18n="facil">Facilitator</button>
    </span>
  </div>
</header>

<main>
  <section class="screen" id="scrLobby">
    <div class="wrap">
      <div class="hero">
        <div>
          <span class="chip" style="background:rgba(255,255,255,.15);color:#fff" id="eventChip"></span>
          <h1 style="margin-top:10px" data-i18n="title">Field Sales Run</h1>
          <p data-i18n="heroP"></p>
        </div>
        <div class="badge"><img id="heroLogo" alt="Mars"></div>
      </div>
      <div class="steps">
        <div class="step"><b data-i18n="s1t"></b><span data-i18n="s1"></span></div>
        <div class="step"><b data-i18n="s2t"></b><span data-i18n="s2"></span></div>
        <div class="step"><b data-i18n="s3t"></b><span data-i18n="s3"></span></div>
      </div>
      <div class="grid2" style="margin-top:18px">
        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
            <h2 style="font-size:22px" data-i18n="leaderboard"></h2>
            <span style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"><span class="chip" id="lbScenario"></span><button class="btn ghost sm" id="lobbyScreen" data-i18n="projector"></button></span>
          </div>
          <div style="overflow-x:auto;margin-top:8px"><table class="lb" id="lbTable"></table></div>
          <p class="tip" id="lbNote"></p>
        </div>
        <div class="card" id="joinBox"></div>
            </div>
    </div>
  </section>

  <section class="screen drive" id="scrMap" hidden>
    <div class="drivebox"><canvas id="drive" aria-label="Mars van driving view"></canvas><canvas id="hudc" aria-hidden="true"></canvas>
      <button class="radarbtn" id="radarBtn" data-i18n-al="cityMap"></button>
      <div id="drivePrompt" class="driveprompt"></div>
      <div class="dtools">
        <button class="ib" id="mapBtn"><span class="ibi" data-ic="route"></span><span class="ibl" data-i18n="mapShort"></span></button>
        <button class="ib" id="routeBtn"><span class="ibi" data-ic="data"></span><span class="ibl" data-i18n="route"></span></button>
        <button class="ib" id="camBtn"><span class="ibi" data-ic="cam"></span><span class="ibl" data-i18n="camShort"></span></button>
        <button class="ib" id="sndBtn" aria-pressed="false"><span class="ibi" data-ic="snd"></span><span class="ibl" data-i18n="sndShort"></span></button>
        <button class="ib" id="setBtn"><span class="ibi" data-ic="gear"></span><span class="ibl" data-i18n="settings"></span></button>
        <button class="ib" id="endDayBtn"><span class="ibi" data-ic="end"></span><span class="ibl" data-i18n="endShort"></span></button>
      </div>
      <div class="touchpad">
        <div class="wheelzone"><div class="wheel" id="dWheel" role="slider" aria-valuemin="-1" aria-valuemax="1" aria-valuenow="0" data-i18n-al="steerL"></div><div class="arrows" id="dArrows" hidden><button class="tpb arr" id="dL" data-i18n-al="steerL">&#9664;</button><button class="tpb arr" id="dR" data-i18n-al="steerR">&#9654;</button></div><button class="tiltbox" id="dTilt" hidden><span id="tiltInd" class="tiltind"></span><small data-i18n="recenter"></small></button></div>
        <div class="pedals"><button class="tpb hbk" id="dHB" data-i18n="handbrake"></button><button class="tpb brk" id="dBrake" data-i18n="brake"></button><button class="tpb gas" id="dGas" data-i18n="gas"></button></div>
      </div>
      <p class="kbdhint" data-i18n="kbdHint"></p>
      <div id="setPanel" class="setpanel" hidden></div>
      <div id="mapView" class="mapview" hidden>
        <div class="mv-top"><div><div class="label" data-i18n="mapHint"></div><h2 data-i18n="cityMap"></h2></div><button class="btn ghost sm" id="mapClose" data-i18n="close"></button></div>
        <canvas id="mapC"></canvas>
        <div id="mvCard" class="mv-card" hidden></div>
        <div id="mvList" class="mv-list"></div>
      </div>
    </div>
    <div id="routeDrawer" class="drawer" hidden>
      <div class="drawer-in">
        <div class="drawer-h"><div><div class="label" id="mapDayLabel"></div><h2 data-i18n="routeTitle"></h2></div><button class="btn ghost sm" id="routeClose" data-i18n="close"></button></div>
        <span class="chip" id="targetChip"></span>
        <div id="mapExtras"></div>
        <div class="stores" id="storeCards"></div>
      </div>
    </div>
  </section>

  <section class="screen storescr" id="scrStore" hidden>
    <div class="storeview">
      <div class="stage" id="stage"><div class="world" id="world"></div>
        <div class="st-top"><div class="st-title"><div class="label" id="stKind"></div><h2 id="stName"></h2></div><div class="st-checks" id="audit"></div></div>
        <button class="hold st-l" id="leftBtn" data-i18n-al="walkL">&#9664;</button><button class="hold st-r" id="rightBtn" data-i18n-al="walkR">&#9654;</button>
      </div>
      <div class="dock">
        <button class="btn ghost dk-back" id="leaveBtn"><span class="ibi" data-ic="back"></span><span data-i18n="backCar"></span></button>
        <div class="dock-mid">
          <button class="dk" id="dataBtn"><span class="ibi" data-ic="data"></span><span data-i18n="storeData"></span></button>
          <button class="dk" id="planoBtn"><span class="ibi" data-ic="plano"></span><span data-i18n="plano"></span></button>
          <button class="dk" id="hlBtn" aria-pressed="false"><span class="ibi" data-ic="hl"></span><span data-i18n="hl"></span></button>
        </div>
        <button class="btn gold dk-talk" id="talkBtn"><span class="ibi" data-ic="talk"></span><span data-i18n="talk"></span></button>
      </div>
    </div>
  </section>

  <section class="screen" id="scrAdmin" hidden>
    <div class="wrap">
      <div class="storehead">
        <div><div class="label" data-i18n="backend"></div><h2 data-i18n="ctrlRoom"></h2></div>
        <button class="btn ghost sm" id="admBack" data-i18n="backGame"></button>
      </div>
      <div class="tabs" id="admTabs" role="tablist"></div>
      <div id="admBody"></div>
      <div class="savebar" id="admSave" hidden><span id="admSaveMsg"></span><button class="btn gold sm" id="admSaveBtn" data-i18n="saveScen"></button></div>
    </div>
  </section>
  <section class="screen" id="scrScreen" hidden><div id="screenBody"></div></section>
</main>

<div id="overlay" class="ov" hidden></div>
<div id="pauseWall" class="pausewall" hidden><div><h2 data-i18n="eventPaused"></h2><p id="pauseMsg" style="font-size:18px;max-width:40ch;margin:12px auto 0"></p><button class="btn gold" id="pauseAdm" hidden style="margin-top:18px" data-i18n="facil"></button></div></div>
