<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0000A0">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}</style>
<title>Mars Field Sales Run</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Fredoka:wght@500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap">
<style>
/* Layout: sticky HUD over one active screen (lobby, map, store, overlays). Single bright "game world" theme, set explicitly. */
:root{
  --mars:#0000A0; --mars-2:#2f2fd8; --mars-soft:#e6e7fb;
  --ink:#15163b; --muted:#5d6089; --paper:#f2f3fa; --card:#ffffff; --line:#d8daee;
  --gold:#f2b705; --good:#178a4c; --bad:#cf2e2e; --warn:#d97b00;
  --road:#c9cbe0; --grass:#d9ecd2; --water:#a9cdf0;
  --display:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito Sans','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
*{box-sizing:border-box}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,[data-act]:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;line-height:1.1}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:800;background:var(--mars);color:#fff;box-shadow:0 3px 0 #00005e;transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #00005e}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--card);color:var(--mars);box-shadow:0 0 0 2px var(--mars) inset}
.btn.gold{background:var(--gold);color:#3a2a00;box-shadow:0 3px 0 #a87e00}
.btn.red{background:var(--bad);box-shadow:0 3px 0 #8a1c1c}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:800;background:var(--mars-soft);color:var(--mars)}
.chip.good{background:#dcf3e5;color:var(--good)}.chip.bad{background:#fbe1e1;color:var(--bad)}.chip.warn{background:#fdecd0;color:#8a4d00}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.muted{color:var(--muted)}
.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--mars);color:#fff}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--mars)}
.hud .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:9px}
.hud .logo{background:#fff;border-radius:8px;padding:4px 8px;display:flex}
.hud .logo img{height:16px;display:block}
.hud .title{font-family:var(--display);font-weight:600;font-size:17px;margin-inline-end:auto}
.hud .stat{display:flex;align-items:center;gap:6px;font-weight:800}
.hud .stat small{opacity:.75;font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.hearts{display:flex;gap:3px}
.hearts svg{width:18px;height:18px}
.hud .btn{background:#fff;color:var(--mars);box-shadow:none}

/* screens */
.screen{padding-block:18px 40px}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px}
@media (max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}

/* lobby */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;background:var(--mars);color:#fff;border-radius:22px;padding:26px;position:relative;overflow:hidden}
.hero h1{font-size:clamp(30px,5vw,48px)}
.hero p{max-width:56ch;opacity:.9;margin:.6em 0 0}
.hero .badge{background:#fff;border-radius:16px;padding:14px 18px}
.hero .badge img{width:150px;display:block}
.hero::after{content:"";position:absolute;right:-60px;bottom:-80px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.07)}
@media (max-width:640px){.hero{grid-template-columns:1fr}.hero .badge{justify-self:start}}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}
@media (max-width:700px){.steps{grid-template-columns:1fr}}
.step{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.step b{font-family:var(--display);font-weight:600;font-size:17px;display:block;margin-bottom:4px;color:var(--mars)}
.teamrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.teamrow:first-child{border-top:0}
.dot{width:14px;height:14px;border-radius:50%;flex:none}
.teamrow .nm{font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb{width:100%;border-collapse:collapse;font-size:14px}
.lb th{text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:6px 6px;border-bottom:2px solid var(--line)}
.lb td{padding:8px 6px;border-bottom:1px solid var(--line)}
.lb td.r,.lb th.r{text-align:right}
.lb tr.me td{background:var(--mars-soft)}
.rank{font-family:var(--display);font-weight:700;color:var(--mars);width:28px}
.form{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.form input[type=text]{flex:1 1 180px;min-width:0;border:2px solid var(--line);border-radius:10px;padding:9px 12px;font:inherit;background:#fff;color:var(--ink)}
.swatches{display:flex;gap:6px;align-items:center}
.swatches button{width:26px;height:26px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.swatches button[aria-pressed=true]{box-shadow:0 0 0 3px var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.legend .pk{font-size:11px;font-weight:800;padding:4px 8px;border-radius:6px}

/* map */
.drivebox{position:relative;border-radius:20px;overflow:hidden;border:1px solid var(--line);background:#e9dfc8}
.drivebox canvas{display:block;width:100%;touch-action:none}
#hudc{position:absolute;inset:0;pointer-events:none}
.driveprompt{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;justify-content:center;max-width:calc(100% - 24px)}
.driveprompt .btn{font-size:16px;padding:12px 20px;white-space:nowrap}
.driveprompt kbd{background:rgba(255,255,255,.6);border-color:rgba(0,0,0,.2)}
.driveprompt .chip{font-size:14px;padding:6px 14px}
.hold.wide{width:auto;padding:0 18px;font-size:15px}
.hold.gas{background:var(--mars);color:#fff;box-shadow:none;min-width:90px}
.vanside{background:var(--mars);border-radius:18px 46px 8px 8px;border-top:5px solid var(--gold)}
.vanside .win{position:absolute;right:14px;top:8px;width:34px;height:22px;background:#bcdcf2;border-radius:4px 16px 2px 2px}
.vanside .panel{position:absolute;left:12px;top:10px;width:84px;height:30px;background:#fff;border-radius:6px;display:flex;align-items:center;justify-content:center}
.vanside .panel img{width:70px}
.vanside::after{content:"";position:absolute;left:20px;bottom:-14px;width:28px;height:28px;border-radius:50%;background:#222;box-shadow:88px 0 0 #222}
.rep .hd::before{content:"";position:absolute;left:-4px;top:-3px;width:42px;height:15px;background:var(--mars);border-radius:16px 16px 3px 3px;box-shadow:12px 4px 0 -3px var(--mars)}
.rep .bd::before{content:"MARS";position:absolute;left:0;right:0;top:12px;text-align:center;color:#fff;font:800 10px/1 var(--display);letter-spacing:.06em}
.rep .bd{box-shadow:inset 0 -6px 0 var(--gold)}
.stores{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}
@media (max-width:760px){.stores{grid-template-columns:1fr}}
.storecard{display:flex;flex-direction:column;gap:6px}
.storecard h3{font-size:19px}
.storecard .row{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.storecard .btn{margin-top:auto}

/* store stage */
.storehead{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:10px}
.storehead h2{font-size:26px}
.stage{position:relative;height:380px;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#cfd7ea;user-select:none;-webkit-user-select:none;touch-action:pan-y}
.world{position:absolute;top:0;left:0;height:380px;will-change:transform}
.world>*{position:absolute}
.floor{left:0;right:0;top:330px;height:50px}
.wall{left:0;right:0;top:0;height:330px}
.koshk .wall{background:linear-gradient(#bfe3ff 0 70px,#e9d3b3 70px)}
.koshk .floor{background:repeating-linear-gradient(90deg,#b9b4ab 0 58px,#aaa59c 58px 60px)}
.super .wall{background:linear-gradient(#f4f1e6,#e9e4d2)}
.super .floor{background:repeating-linear-gradient(90deg,#e0dccd 0 48px,#d2cdbd 48px 50px)}
.hyper .wall{background:linear-gradient(#e7ecf3,#d9e0ea)}
.hyper .floor{background:repeating-linear-gradient(90deg,#cfd6e0 0 78px,#c2c9d4 78px 80px)}
.awning{background:repeating-linear-gradient(90deg,#d23a2f 0 40px,#fff 40px 80px);border-radius:0 0 14px 14px;box-shadow:0 6px 0 rgba(0,0,0,.08)}
.sign{background:#1f7a46;color:#fff;font-family:var(--display);font-weight:600;font-size:20px;display:flex;align-items:center;justify-content:center;border-radius:8px}
.kiosk-in{background:#5b4a3a;border-radius:6px 6px 0 0}
.fridge{background:#eef3f7;border:4px solid #9fb0bf;border-radius:10px}
.fridge .glass{position:absolute;inset:10px;background:repeating-linear-gradient(180deg,#d7ebf7 0 52px,#9fb0bf 52px 55px);border-radius:4px;opacity:.85}
.counter{background:linear-gradient(#8a5a35,#6e4527);border-radius:8px 8px 0 0;box-shadow:inset 0 6px 0 #a87249}
.super .counter,.hyper .counter{background:linear-gradient(#c9d0dc,#aeb7c6);box-shadow:inset 0 6px 0 #dfe4ec}
.till{background:#2c2f45;border-radius:6px}
.doors{background:linear-gradient(90deg,#bcdcf2 49%,#7d93a8 49% 51%,#bcdcf2 51%);border:6px solid #7d93a8;border-radius:6px 6px 0 0;display:flex;align-items:flex-start;justify-content:center;cursor:pointer}
.doors span,.exit span{background:var(--ink);color:#fff;font-weight:800;font-size:12px;padding:3px 8px;border-radius:6px;margin-top:8px}
.exit{cursor:pointer;display:flex;align-items:flex-start;justify-content:center}
.office{background:#a77b52;border:6px solid #7a5532;border-radius:6px 6px 0 0;color:#fff;font-weight:800;font-size:12px;display:flex;justify-content:center;padding-top:10px}
.lane{background:#2c2f45;border-radius:4px}
.compstand{background:#fff;border:3px solid #c8102e;border-radius:6px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px}
.compstand b{background:#c8102e;color:#fff;font-family:var(--display);font-weight:600;width:100%;text-align:center;border-radius:3px;font-size:14px}
.compstand i{display:block;width:80%;height:30px;background:repeating-linear-gradient(90deg,#c8102e 0 14px,#a80d26 14px 16px);border-radius:3px}
.compstand small{font-size:10px;font-weight:800;color:#c8102e}

.shelf{background:#8c96a8;border-radius:6px;box-shadow:inset 0 0 0 6px #6f7a8e}
.board{position:absolute;left:4px;right:4px;height:6px;background:#5a6478;border-radius:2px}
.pack{position:absolute;width:40px;height:50px;border-radius:4px;display:flex;align-items:flex-end;justify-content:center;padding:2px;cursor:pointer;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18),inset 0 8px 0 rgba(255,255,255,.12);transition:opacity .2s,transform .1s}
.pack span{font-size:8.5px;font-weight:800;line-height:1.05;text-align:center;word-break:break-word}
.pack:hover{transform:translateY(-2px)}
.world.hl .pack:not(.m){opacity:.28}
.world.hl .pack.m{outline:2px solid var(--gold);outline-offset:1px}
.gap{position:absolute;height:50px;border:2px dashed #e7ecf5;border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:2px;cursor:pointer;background:rgba(0,0,0,.12)}
.gap span{font-size:9px;font-weight:800;color:#fff;background:#3b4255;border-radius:3px;padding:0 4px}
.gap em{font-style:normal;font-size:8px;font-weight:800;color:#e7ecf5}
.gap.flag{border-color:var(--bad);background:rgba(207,46,46,.25)}
.gap.flag em{color:#fff;background:var(--bad);border-radius:3px;padding:0 3px;margin-bottom:2px}
.eyetag{position:absolute;right:calc(100% + 4px);font-size:10px;font-weight:800;color:#fff;background:var(--ink);border-radius:5px;padding:2px 6px;white-space:nowrap}
.eyetag.found{background:var(--bad)}
.spot{border:2px dashed var(--mars-2);border-radius:10px;background:rgba(47,47,216,.08);display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;font-size:11px;font-weight:800;color:var(--mars);padding:4px;animation:pulse 2.4s ease-in-out infinite}
.spot b{display:block;font-size:18px;line-height:1}
.spot.placed{border:0;background:none;animation:none;padding:0}
@keyframes pulse{50%{background:rgba(47,47,216,.18)}}
.npc{cursor:pointer}
.bubble{position:absolute;left:50%;transform:translateX(-50%);top:-30px;background:#fff;border:2px solid var(--ink);border-radius:10px;padding:2px 8px;font-size:11px;font-weight:800;white-space:nowrap}
.person{position:absolute;inset:0}
.person .hd{position:absolute;left:50%;top:0;width:34px;height:34px;margin-left:-17px;border-radius:50%;background:#c98d62;box-shadow:inset 0 9px 0 var(--hair,#2b1d14)}
.person .bd{position:absolute;left:50%;top:32px;width:44px;height:48px;margin-left:-22px;border-radius:14px 14px 6px 6px;background:var(--shirt,#fff)}
.person .lg{position:absolute;left:50%;top:78px;width:30px;height:32px;margin-left:-15px;background:linear-gradient(90deg,var(--pants,#2c2f45) 45%,transparent 45% 55%,var(--pants,#2c2f45) 55%)}
.player{width:46px;height:110px;top:220px;z-index:5;pointer-events:none;margin-left:-23px}
.player .bd::after{content:"";position:absolute;right:-8px;top:12px;width:18px;height:24px;background:#222;border:2px solid #555;border-radius:3px}
.player.walk .person{animation:bob .35s ease-in-out infinite}
.player.flip .person{transform:scaleX(-1)}
@keyframes bob{50%{transform:translateY(-3px)}}
.player.flip.walk .person{animation:bobf .35s ease-in-out infinite}
@keyframes bobf{0%,100%{transform:scaleX(-1)}50%{transform:scaleX(-1) translateY(-3px)}}

/* POSM visuals */
.posm{width:100%;height:100%;position:relative}
.p-gondola{background:#fff;border:4px solid var(--mars);border-radius:6px;display:flex;flex-direction:column;gap:5px;padding:5px}
.p-head{background:var(--mars);color:#fff;font-family:var(--display);font-weight:600;font-size:12px;text-align:center;border-radius:3px;padding:2px}
.p-tray{flex:1;display:flex;gap:2px;border-bottom:4px solid #9aa3c9}
.p-tray i{flex:1;border-radius:2px}
.p-stand{background:#fff;border:3px solid var(--mars);border-radius:6px;display:flex;flex-direction:column;gap:4px;padding:4px}
.p-stand img{width:100%;padding:2px 4px}
.p-cdu{background:var(--mars);border-radius:5px;display:flex;flex-direction:column;justify-content:flex-end;padding:3px}
.p-cdu .p-tray{flex:none;height:60%;border:0}
.p-cdu small{color:#fff;font-size:9px;font-weight:800;text-align:center}
.p-strip{background:var(--mars);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;border-radius:4px;height:60%!important;margin-top:auto}
.p-dangler{display:flex;flex-direction:column;align-items:center}
.p-dangler::before{content:"";width:2px;height:24px;background:#555}
.p-dangler div{width:56px;height:56px;border-radius:50%;background:var(--gold);border:3px solid var(--mars);display:flex;align-items:center;justify-content:center;text-align:center;font-size:10px;font-weight:800;color:var(--mars);line-height:1.1;animation:sway 3s ease-in-out infinite;transform-origin:top center}
@keyframes sway{50%{transform:rotate(6deg)}}

.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.controls .sp{flex:1}
.hold{width:54px;height:44px;border-radius:12px;border:0;background:var(--card);box-shadow:0 0 0 2px var(--line) inset;font-size:20px;font-weight:800;color:var(--mars);touch-action:none}
.audit{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
@media (max-width:700px){.audit{grid-template-columns:1fr}}
.audit .card{padding:12px}
.audit .big{font-family:var(--display);font-size:22px;font-weight:600}
.tip{font-size:13px;color:var(--muted);margin-top:8px}
kbd{font-family:inherit;font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:#fff}

/* overlays */
.ov{position:fixed;inset:0;z-index:40;background:rgba(14,15,48,.55);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:calc(20px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.sheet{background:var(--paper);border-radius:20px;width:min(1100px,100%);padding:18px;box-shadow:0 20px 60px rgba(0,0,30,.35)}
.sheet.narrow{width:min(560px,100%)}
.sheethead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.sheethead h2{font-size:24px}
.posmlist{display:grid;gap:8px}
.posmopt{display:flex;align-items:center;gap:12px;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 12px}
.posmopt:hover:not(:disabled){border-color:var(--mars)}
.posmopt:disabled{opacity:.45;cursor:not-allowed}
.posmopt .ic{width:44px;height:52px;flex:none}
.posmopt div{flex:1;min-width:0}
.posmopt b{display:block}
.posmopt small{color:var(--muted)}

/* negotiation */
.nego{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:16px}
@media (max-width:900px){.nego{grid-template-columns:minmax(0,1fr)}}
.owner{display:flex;gap:12px;align-items:center}
.avatar{width:58px;height:58px;border-radius:50%;background:var(--mars);color:#fff;font-family:var(--display);font-weight:600;font-size:22px;display:flex;align-items:center;justify-content:center;flex:none}
.meter{height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--bad),var(--warn),var(--good));transition:width .4s}
.pips{display:flex;gap:4px}
.pips i{width:16px;height:16px;border-radius:4px;background:var(--gold)}
.pips i.off{background:var(--line)}
.chat{display:flex;flex-direction:column;gap:8px;max-height:300px;overflow:auto;padding:4px;margin-top:10px}
.msg{max-width:88%;padding:8px 12px;border-radius:14px;font-size:14px}
.msg.o{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.p{align-self:flex-end;background:var(--mars);color:#fff;border-bottom-right-radius:4px}
.msg.s{align-self:center;background:#fdecd0;color:#6b3d00;font-size:13px;font-weight:700;text-align:center}
.skus{width:100%;border-collapse:collapse;font-size:13px}
.skus td{padding:5px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
.skus .sw{width:12px;height:22px;border-radius:3px;display:inline-block;vertical-align:middle}
.qty{display:flex;align-items:center;gap:4px;justify-content:flex-end}
.qty button{width:28px;height:28px;border-radius:8px;border:0;background:var(--mars-soft);color:var(--mars);font-weight:800}
.qty input{width:46px;text-align:center;border:2px solid var(--line);border-radius:8px;padding:3px;font:inherit;font-weight:800}
.tag{font-size:10px;font-weight:800;border-radius:4px;padding:1px 5px;margin-left:4px}
.tag.oos{background:var(--bad);color:#fff}.tag.fast{background:#dcf3e5;color:var(--good)}
.levers{display:grid;gap:10px;margin-top:12px}
.seg{display:flex;flex-wrap:wrap;gap:5px}
.seg button{border:2px solid var(--line);background:var(--card);border-radius:9px;padding:5px 10px;font-weight:800;font-size:13px}
.seg button[aria-pressed=true]{background:var(--mars);border-color:var(--mars);color:#fff}
.sum{display:grid;grid-template-columns:1fr auto;gap:3px 12px;font-size:14px;margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.sum b{font-variant-numeric:tabular-nums;text-align:right}
.sum .tot{font-family:var(--display);font-size:18px;color:var(--mars)}
.policy{background:#fff8e1;border:1px dashed #d9a400;border-radius:12px;padding:10px 12px;font-size:13px;margin-top:12px}
.policy ul{margin:4px 0 0;padding-left:18px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}

.result h2{font-size:30px}
.coach{display:grid;gap:6px;margin:12px 0;padding:0;list-style:none}
.coach li{display:flex;gap:8px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px}
.coach li i{flex:none;width:10px;height:10px;border-radius:50%;margin-top:6px;background:var(--muted)}
.coach li.good i{background:var(--good)}.coach li.bad i{background:var(--bad)}.coach li.warn i{background:var(--warn)}
.stars{display:flex;gap:6px}
.stars svg{width:34px;height:34px}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;display:grid;gap:6px;width:min(460px,calc(100% - 32px));pointer-events:none}
.toast{background:var(--ink);color:#fff;padding:10px 14px;border-radius:12px;font-size:14px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,30,.3);animation:tin .25s}
.toast.good{background:var(--good)}.toast.bad{background:var(--bad)}.toast.warn{background:#9a5800}
@keyframes tin{from{transform:translateY(10px);opacity:0}}

/* admin */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.field label{display:block;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.field input,.field select,.field textarea{width:100%;border:2px solid var(--line);border-radius:9px;padding:7px 9px;font:inherit;background:#fff;color:var(--ink)}
.field textarea{min-height:60px;resize:vertical}
.field.wide{grid-column:1/-1}
fieldset{border:1px solid var(--line);border-radius:14px;padding:12px;margin:0 0 12px}
legend{font-family:var(--display);font-weight:600;font-size:17px;padding:0 6px;color:var(--mars)}
.pausewall{position:fixed;inset:0;z-index:55;background:rgba(0,0,80,.85);display:flex;align-items:center;justify-content:center;color:#fff;text-align:center;padding:24px}
.pausewall h2{font-size:38px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* language */
html[lang=ar]{--display:'Cairo','Fredoka',system-ui,sans-serif;--body:'Cairo','Nunito Sans',system-ui,sans-serif}
html[lang=ar] .label,html[lang=ar] .lb th{letter-spacing:0}
.stage,.drivebox{direction:ltr}
.hudbtns{display:flex;gap:6px;flex-wrap:wrap}
#langBtn{font-family:'Cairo','Nunito Sans',sans-serif}
.headbtns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.kbdhint{font-size:13px;margin:8px 0 0}
/* touch driving */
.touchpad{position:absolute;left:0;right:0;bottom:0;display:none;justify-content:space-between;align-items:flex-end;padding:12px max(12px,env(safe-area-inset-right,0px)) 12px max(12px,env(safe-area-inset-left,0px));pointer-events:none}
.touchpad>div{display:flex;gap:10px;align-items:flex-end;pointer-events:auto}
.tpb{width:70px;height:70px;border-radius:50%;border:0;background:rgba(255,255,255,.9);color:var(--mars);font-size:22px;font-weight:800;box-shadow:0 4px 14px rgba(0,0,40,.28);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font-family:var(--body)}
.tpb.gas{background:var(--mars);color:#fff;width:86px;height:86px;font-size:16px}
.tpb.brk{font-size:14px}
.tpb.on{transform:scale(.92);filter:brightness(.9)}
@media (pointer:coarse),(max-width:760px){.touchpad{display:flex}.kbdhint{display:none}.driveprompt{bottom:auto;top:112px}.driveprompt .btn{font-size:15px;padding:12px 16px}}
button,.pack,.gap,.spot,.npc{touch-action:manipulation}
@media (max-width:640px){
 .hud .wrap{gap:8px;padding-block:7px}
 .hud .title,#hudTeam{display:none!important}
 .hud .stat small{display:none}
 .hud .logo{margin-inline-end:auto}
 .hud .btn.sm{padding:6px 9px;font-size:12px}
 .screen{padding-block:12px 28px}
 .storehead h2{font-size:21px}
 .hero{padding:18px}
 .sheet{padding:12px;border-radius:16px}
 .ov{padding-left:6px;padding-right:6px}
 .chat{max-height:190px}
 .nego .actions{position:sticky;bottom:0;background:var(--card);padding-block:10px;margin-bottom:-12px;z-index:2;border-top:1px solid var(--line)}
 .sheethead h2{font-size:20px}
}
/* backend */
.scbar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:12px}
.acc{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px}
.acc summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px}
.acc summary::-webkit-details-marker{display:none}
.acc summary b{display:block;font-family:var(--display);font-weight:600;font-size:18px}
.acc summary::after{content:"+";font-weight:800;font-size:22px;color:var(--mars);flex:none}
.acc[open] summary::after{content:"−"}
.accbody{padding:0 16px 16px}
.accbody h4{font-family:var(--display);font-weight:600;font-size:15px;margin:18px 0 8px;color:var(--mars)}
.prow{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.prow .fields{flex:1;min-width:0}
.pk-prev{width:46px;height:58px;border-radius:6px;flex:none;display:flex;align-items:flex-end;justify-content:center;font-size:9px;font-weight:800;padding:3px;text-align:center;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.field.w2{grid-column:span 2}
.fields.two{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.field input[type=color]{height:40px;padding:2px}
.savebar{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--ink);color:#fff;border-radius:14px;padding:10px 12px;margin-top:12px;z-index:5;box-shadow:0 8px 24px rgba(0,0,30,.25);font-weight:700}
.savebar.dirty{background:var(--mars)}
.teamcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-top:12px}
.teamcard{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:6px}
.tc-head{display:flex;align-items:center;gap:8px;min-width:0}
.tc-stats{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted)}
.tc-stats b{color:var(--ink)}
@media (max-width:640px){.prow{flex-direction:column}.field.w2{grid-column:1/-1}.fields{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.fields.two{grid-template-columns:minmax(0,1fr)}.acc summary{padding:12px}.accbody{padding:0 12px 12px}}
</style>


<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
(function(){
  var cfg=window.FIREBASE_CONFIG, ADMINS=(window.FACILITATOR_EMAILS||[]).map(function(e){return String(e).toLowerCase();});
  if(!cfg||!cfg.apiKey||/^PASTE/.test(cfg.apiKey)||typeof firebase==='undefined'){
    window.claude={use:async function(){return null;}};
    console.warn('Firebase not configured: running in offline mode.');return;
  }
  firebase.initializeApp(cfg);
  var auth=firebase.auth(), fs=firebase.firestore();
  var ready=new Promise(function(res){
    var un=auth.onAuthStateChanged(async function(u){
      if(u){un();res(u);return;}
      try{await auth.signInAnonymously();}catch(e){console.error('Anonymous sign-in failed:',e.code);window.__fbAnonError=e.code;un();res(null);}
    });
  });
  function err(e){var c=e&&e.code;return{code:c==='permission-denied'?'invalid_argument':c==='resource-exhausted'?'quota_exceeded':c==='not-found'?'invalid_argument':'unavailable',message:(e&&e.message)||'error'};}
  // Firestore cannot store nested arrays (the shelf grid), so the saved game "state" travels as JSON text.
  function enc(d){if(d&&d.state&&typeof d.state==='object'){d=Object.assign({},d,{state:JSON.stringify(d.state)});}return d;}
  function dec(x){if(x&&typeof x.state==='string'){try{x=Object.assign({},x,{state:JSON.parse(x.state)});}catch(e){}}return x;}
  function wSnap(s){return{id:s.id,exists:s.exists,data:function(){return s.exists?dec(s.data()):undefined;},metadata:s.metadata};}
  function wQuery(q){var docs=q.docs.map(wSnap);return{docs:docs,size:q.size,empty:q.empty,docChanges:function(){return q.docChanges();},metadata:q.metadata};}
  function fail(e){console.error('Firestore:',e&&e.code,e&&e.message);throw err(e);}
  function wrapDoc(path){
    var r=fs.doc(path);
    return{id:r.id,path:path,
      get:function(){return r.get().then(wSnap);},
      set:function(d){return r.set(enc(d)).catch(fail);},
      update:function(d){return r.update(enc(d)).catch(fail);},
      delete:function(){return r.delete().catch(fail);},
      onSnapshot:function(n,er){return r.onSnapshot(function(s){n(wSnap(s));},function(e){console.error('Firestore listen:',e.code,e.message);er&&er(err(e));});},
      acquire:async function(o){
        var holder=o.holder,ttl=o.ttlMs||30000;
        try{return await fs.runTransaction(async function(tx){
          var s=await tx.get(r),d=s.exists?s.data():null,now=Date.now();
          if(d&&d.holder!==holder&&d.expires>now)return{acquired:false,expiresAt:new Date(d.expires).toISOString()};
          tx.set(r,{holder:holder,expires:now+ttl});return{acquired:true,holder:holder};
        });}catch(e){console.warn('lock:',e&&e.code);return{acquired:true};}
      }};
  }
  function wrapCol(path){
    var c=fs.collection(path);
    return{path:path,
      get:function(){return c.get().then(wQuery);},
      onSnapshot:function(n,er){return c.onSnapshot(function(q){n(wQuery(q));},function(e){console.error('Firestore listen:',e.code,e.message);er&&er(err(e));});},
      doc:function(id){return wrapDoc(path+'/'+(id||c.doc().id));}};
  }
  var db={doc:wrapDoc,collection:wrapCol};
  function isFac(u){return !!(u&&!u.isAnonymous&&u.email&&ADMINS.indexOf(u.email.toLowerCase())>=0);}
  var userNs={
    id:async function(){var u=await ready;return u?u.uid:null;},
    canEdit:async function(){return isFac(await ready);},
    isOwner:async function(){return isFac(await ready);},
    can:async function(){return true;},
    me:async function(){var u=await ready;return{id:u?u.uid:null,name:u&&u.email||'',email:u&&u.email||null,isOwner:isFac(u),canEdit:isFac(u),avatarUrl:'',color:'#0000A0'};}
  };
  window.claude={use:async function(name){var u=await ready;if(!u)return null;if(name==='db')return db;if(name==='user')return userNs;return null;}};

  // Facilitator sign-in link + form
  function A(){try{return localStorage.getItem('msr-lang')==='ar';}catch(e){return false;}}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  document.addEventListener('DOMContentLoaded',async function(){
    var host=document.querySelector('#scrLobby .wrap');if(!host)return;
    var bar=document.createElement('div');bar.style.cssText='margin-top:18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)';
    host.appendChild(bar);
    var u=await ready;
    if(!u){bar.innerHTML='<b style="color:var(--bad)">Player sign-in failed ('+esc(window.__fbAnonError||'unknown')+').</b> Enable Anonymous in Authentication > Sign-in method, and add this website under Authorized domains.';return;}
    if(u&&!u.isAnonymous&&!isFac(u)){bar.innerHTML=(A()?'داخل بـ '+esc(u.email)+'، بس الإيميل ده مش في FACILITATOR_EMAILS في firebase-config.js. ':'Signed in as '+esc(u.email)+', but this email is not in FACILITATOR_EMAILS in firebase-config.js. ')+'<button class="btn ghost sm" id="fbOut">'+(A()?'خروج':'Sign out')+'</button>';bar.querySelector('#fbOut').onclick=async function(){await auth.signOut();location.reload();};}
    else if(isFac(u)){bar.innerHTML=(A()?'داخل كمسؤول (':'Signed in as facilitator (')+esc(u.email)+') <button class="btn ghost sm" id="fbOut">'+(A()?'خروج':'Sign out')+'</button> <a class="btn sm" href="#admin" id="fbAdm">'+(A()?'لوحة التحكم':'Open backend')+'</a>';var fa=bar.querySelector('#fbAdm');fa.onclick=function(e){e.preventDefault();if(window.openAdmin)window.openAdmin();};
      bar.querySelector('#fbOut').onclick=async function(){await auth.signOut();location.reload();};}
    else{bar.innerHTML='<button class="btn ghost sm" id="fbIn">'+(A()?'دخول المسؤول':'Facilitator sign-in')+'</button>';
      bar.querySelector('#fbIn').onclick=function(){
        var ov=document.getElementById('overlay');ov.hidden=false;
        ov.innerHTML='<div class="sheet narrow"><div class="sheethead"><h2>'+(A()?'دخول المسؤول':'Facilitator sign-in')+'</h2><button class="btn ghost sm" id="fbX">'+(A()?'إلغاء':'Cancel')+'</button></div><form id="fbForm" class="fields"><div class="field wide"><label for="fbE">'+(A()?'الإيميل':'Email')+'</label><input id="fbE" type="email" required autocomplete="username"></div><div class="field wide"><label for="fbP">'+(A()?'كلمة السر':'Password')+'</label><input id="fbP" type="password" required autocomplete="current-password"></div><div class="field wide"><button class="btn" type="submit">'+(A()?'دخول':'Sign in')+'</button> <span id="fbErr" style="color:var(--bad);font-weight:700"></span></div></form></div>';
        ov.querySelector('#fbX').onclick=function(){ov.hidden=true;ov.innerHTML='';};
        ov.querySelector('#fbForm').onsubmit=async function(e){e.preventDefault();
          try{await auth.signInWithEmailAndPassword(ov.querySelector('#fbE').value.trim(),ov.querySelector('#fbP').value);location.reload();}
          catch(x){var c=x&&x.code||'',m={'auth/invalid-credential':'Wrong email or password.','auth/wrong-password':'Wrong password.','auth/user-not-found':'No user with this email. Add it in Authentication > Users.','auth/invalid-email':'That email address is not valid.','auth/operation-not-allowed':'Email/Password sign-in is not enabled. Turn it on in Authentication > Sign-in method.','auth/unauthorized-domain':'This website is not authorized. Add it in Authentication > Settings > Authorized domains.','auth/too-many-requests':'Too many attempts. Wait a few minutes and try again.'};ov.querySelector('#fbErr').textContent=(m[c]||'Sign-in failed')+' ('+c+')';}};
      };}
  });
})();

</script>

<body>
<header class="hud" id="hud">
  <div class="wrap">
    <span class="logo"><img id="hudLogo" alt="Mars"></span>
    <span class="title" data-i18n="title">Field Sales Run</span>
    <span class="stat" id="hudTeam" hidden></span>
    <span class="stat" id="hudDay" hidden><small data-i18n="day">Day</small><span class="num" id="dayN">1</span></span>
    <span class="stat" id="hudLives" hidden><small data-i18n="lives">Lives</small><span class="hearts" id="hearts"></span></span>
    <span class="stat" id="hudMoney" hidden><small data-i18n="wallet">Wallet</small><span class="num" id="money">EGP 0</span></span>
    <span class="hudbtns">
      <button class="btn sm" id="langBtn" data-i18n="langBtn">عربي</button>
      <button class="btn sm" id="pauseBtn" hidden data-i18n="pause">Pause &amp; save</button>
      <button class="btn sm" id="adminBtn" hidden data-i18n="facil">Facilitator</button>
    </span>
  </div>
</header>

<main>
  <section class="screen" id="scrLobby">
    <div class="wrap">
      <div class="hero">
        <div>
          <span class="chip" style="background:rgba(255,255,255,.15);color:#fff" id="eventChip"></span>

          <p data-i18n="heroP"></p>
        </div>
        <div class="badge"><img id="heroLogo" alt="Mars"></div>
      </div>
      <div class="steps">
        <div class="step"><b data-i18n="s1t"></b><span data-i18n="s1"></span></div>
        <div class="step"><b data-i18n="s2t"></b><span data-i18n="s2"></span></div>
        <div class="step"><b data-i18n="s3t"></b><span data-i18n="s3"></span></div>
      </div>
      <div class="grid2" style="margin-top:18px">
        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
            <h2 style="font-size:22px" data-i18n="leaderboard"></h2>
            <span class="chip" id="lbScenario"></span>
          </div>
          <div style="overflow-x:auto;margin-top:8px"><table class="lb" id="lbTable"></table></div>
          <p class="tip" id="lbNote"></p>
        </div>
        <div class="card">
          <h2 style="font-size:22px" data-i18n="yourTeam"></h2>

            <button class="btn" id="createTeam" data-i18n="startRun"></button>
          </div>
          <div id="teamList" style="margin-top:12px"></div>
          <div class="label" style="margin-top:16px" data-i18n="onShelf"></div>
          <div class="legend" id="legend"></div>
        </div>
      </div>
    </div>
  </section>

  <section class="screen" id="scrMap" hidden>
    <div class="wrap">
      <div class="storehead">
        <div><div class="label" id="mapDayLabel"></div><h2 data-i18n="driveRoute"></h2></div>
        <div class="headbtns">
          <span class="chip" id="targetChip"></span>
          <button class="btn ghost sm" id="camBtn" data-i18n="camChase"></button>
          <button class="btn ghost sm" id="sndBtn" aria-pressed="false" data-i18n="sndOff"></button>
          <button class="btn ghost sm" id="endDayBtn" data-i18n="endDay"></button>
        </div>
      </div>
      <div class="drivebox"><canvas id="drive" aria-label="Mars van driving view"></canvas><canvas id="hudc" aria-hidden="true"></canvas><div id="drivePrompt" class="driveprompt"></div>
        <div class="touchpad">
          <div><button class="tpb" id="dLeft" data-i18n-al="steerL">&#9664;</button><button class="tpb" id="dRight" data-i18n-al="steerR">&#9654;</button></div>
          <div><button class="tpb brk" id="dBrake" data-i18n="brake"></button><button class="tpb gas" id="dGas" data-i18n="gas"></button></div>
        </div>
      </div>
      <p class="kbdhint muted" data-i18n="kbdHint"></p>
      <div class="stores" id="storeCards"></div>
    </div>
  </section>

  <section class="screen" id="scrStore" hidden>
    <div class="wrap">
      <div class="storehead">
        <div><div class="label" id="stKind"></div><h2 id="stName"></h2></div>
        <div class="headbtns">
          <button class="btn ghost sm" id="hlBtn" aria-pressed="false" data-i18n="hl"></button>
          <button class="btn sm" id="talkBtn" data-i18n="talk"></button>
        </div>
      </div>
      <div class="stage" id="stage"><div class="world" id="world"></div></div>
      <div class="controls">
        <button class="hold" id="leftBtn" data-i18n-al="walkL">&#9664;</button>
        <button class="hold" id="rightBtn" data-i18n-al="walkR">&#9654;</button>
        <span class="muted" style="font-size:13px" data-i18n="tapHint"></span>
        <span class="sp"></span>
        <button class="btn ghost sm" id="leaveBtn" data-i18n="backCar"></button>
      </div>
      <div class="audit" id="audit"></div>
    </div>
  </section>

  <section class="screen" id="scrAdmin" hidden>
    <div class="wrap">
      <div class="storehead">
        <div><div class="label" data-i18n="backend"></div><h2 data-i18n="ctrlRoom"></h2></div>
        <button class="btn ghost sm" id="admBack" data-i18n="backGame"></button>
      </div>
      <div class="tabs" id="admTabs" role="tablist"></div>
      <div id="admBody"></div>
      <div class="savebar" id="admSave" hidden><span id="admSaveMsg"></span><button class="btn gold sm" id="admSaveBtn" data-i18n="saveScen"></button></div>
    </div>
  </section>
</main>

<div id="overlay" class="ov" hidden></div>
<div id="pauseWall" class="pausewall" hidden><div><h2 data-i18n="eventPaused"></h2><p id="pauseMsg" style="font-size:18px;max-width:40ch;margin:12px auto 0"></p></div></div>
<div id="toast" aria-live="polite"></div>

function tr(k,v){let s=(I18N[LANG]&&I18N[LANG][k])??I18N.en[k]??k;if(v)for(const x in v)s=s.split('{'+x+'}').join(v[x]);return s;}
function L(o,k){if(!o)return '';return (LANG==='ar'&&o[k+'_ar'])?o[k+'_ar']:o[k];}
const termName=i=>LANG==='ar'?['كاش','١٥ يوم','٣٠ يوم'][i]:TERMS[i];
const stName=t=>L(ST(t),'name'),stOwner=t=>L(ST(t),'owner'),stRole=t=>L(ST(t),'role'),stKind=t=>L(ST(t),'kind');
function ownerLine(t,k){const st=ST(t);if(k==='open')return L(st,'open');const ar=LANG==='ar'&&st.lines_ar&&st.lines_ar[k];return ar||(st.lines||{})[k]||'';}
const pName=p=>L(p,'name'),pShort=p=>L(p,'short')||p.short,pPack=p=>L(p,'pack');
const spLabel=sp=>L(sp,'label'),spTip=sp=>L(sp,'tip'),posmName=k=>L(POSM[k],'name'),posmDesc=k=>L(POSM[k],'desc');
function applyLang(){
  const r=document.documentElement;r.lang=LANG;r.dir=LANG==='ar'?'rtl':'ltr';
  document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=tr(e.dataset.i18n));

  document.querySelectorAll('[data-i18n-al]').forEach(e=>e.setAttribute('aria-label',tr(e.dataset.i18nAl)));
}

function buildScenario(src){const m=deepMerge(DEFAULT_SCENARIO,src||{});if(src&&src.prices&&!src.products)m.products=m.products.map(p=>({...p,price:src.prices[p.id]??p.price}));if(!Array.isArray(m.products)||!m.products.length)m.products=JSON.parse(JSON.stringify(DEF_PRODUCTS));if(!Array.isArray(m.competitors))m.competitors=JSON.parse(JSON.stringify(DEF_COMP));return m;}
let _sc={src:undefined,m:null};
const S=()=>{const id=(TEAM&&TEAM.scenarioId)||EVENT.activeScenario;const src=SCEN[id]||null;if(_sc.m&&_sc.src===src)return _sc.m;const m=buildScenario(src);SKUS=m.products;COMP=m.competitors;indexCatalog();_sc={src,m};return m;};

async function initBackend(){
  try{db=await claude.use('db');}catch(e){db=null;}
  try{user=await claude.use('user');}catch(e){user=null;}
  if(user){try{me=await user.id();isAdmin=await user.canEdit();const cw=await user.can('data.write');if(cw===false)canWrite=false;}catch(e){}}
  $('#adminBtn').hidden=!isAdmin;
  if(!db){NOTE_KEY='offline';$('#lbNote').textContent=tr('offline');loadLocalTeams();renderLobby();return;}
  db.collection('scenarios').onSnapshot(s=>{SCEN={};s.docs.forEach(d=>SCEN[d.id]=d.data());renderLobby();if(G)renderHud();},()=>{});
  db.doc('config/event').onSnapshot(s=>{if(s.exists)EVENT={...EVENT,...s.data()};renderLobby();applyPause();},()=>{});
  subTeams(!$('#scrLobby').hidden);
  if(!canWrite){$('#createTeam').disabled=true;NOTE_KEY='viewOnly';$('#lbNote').textContent=tr('viewOnly');}
}
function loadLocalTeams(){try{TEAMS=JSON.parse(localStorage.getItem('msr-teams')||'[]');}catch(e){TEAMS=[];}}
function saveLocalTeams(){try{localStorage.setItem('msr-teams',JSON.stringify(TEAMS));}catch(e){}}
function teamSummary(){const s=S();return{money:Math.round(G.money),lives:G.lives,day:G.day,deals:G.deals,earned:Math.round(G.earned),status:G.over?'over':'playing',scenarioId:TEAM.scenarioId,updatedAt:Date.now()};}
function save(now){clearTimeout(saveTimer);saveTimer=setTimeout(doSave,now?0:700);}
async function doSave(){
  if(!G||!TEAM)return;
  if(saving){saveQueued=true;return;}
  saving=true;
  const body={...teamSummary(),state:JSON.parse(JSON.stringify(G))};
  try{
    if(db){await db.doc('teams/'+TEAM.id).update(body);}
    else{const t=TEAMS.find(x=>x.id===TEAM.id);if(t)Object.assign(t,body);saveLocalTeams();}
  }catch(e){if(e&&e.code==='invalid_argument'){toast(tr('saveDenied'),'bad');}else if(e&&e.code==='quota_exceeded'){toast(tr('dbFull'),'bad');}}
  saving=false;if(saveQueued){saveQueued=false;doSave();}
}
async function takeLease(id){
  if(!db)return true;
  try{const r=await db.doc('locks/'+id).acquire({holder:TAB,ttlMs:30000});return r.acquired;}catch(e){return true;}
}
function keepLease(){clearInterval(leaseTimer);if(!db||!TEAM)return;leaseTimer=setInterval(()=>{db.doc('locks/'+TEAM.id).acquire({holder:TAB,ttlMs:30000}).catch(()=>{});},20000);}

/* ---------- game state ---------- */
function newGame(){const s=S();return{day:1,lives:s.lives,money:s.startMoney,car:null,odo:0,earned:0,deals:0,dayEarn:0,dayStart:s.startMoney,visits:newVisits(),over:false,history:[]};}
function newVisits(){const v={};for(const t of TYPES)v[t]=newVisit(t);return v;}
function newVisit(t){
  const st=ST(t),fast=list(st.fast);
  const pool=fast.length>=2?fast:SKUS.slice(0,3).map(s=>s.id);
  const need=Math.min(2,pool.length),oos=[];
  while(oos.length<need){const p=pick(pool);if(!oos.includes(p))oos.push(p);}
  const v={status:'open',oos,oosFound:[],eyeIssue:Math.random()<st.eyeChance,eyeFound:false,spots:{},nego:null,shelf:null,earned:0,coach:null};
  v.shelf=genShelf(t,v);return v;
}
function genShelf(t,v){
  const st=ST(t),cols=LAYOUT[t].shelf.cols,rows=4,avoid=list(st.avoid);
  let marsPool=SKUS.map(s=>s.id).filter(id=>!v.oos.includes(id)&&!avoid.includes(id));
  if(!marsPool.length)marsPool=SKUS.map(s=>s.id).filter(id=>!v.oos.includes(id));
  if(!marsPool.length)marsPool=SKUS.map(s=>s.id);
  const compPool=COMP.length?COMP.map(c=>c.id):marsPool;
  const fastIn=list(st.fast).filter(x=>marsPool.includes(x));
  const g=[];
  for(let r=0;r<rows;r++){
    const row=[];
    while(row.length<cols){
      let id;
      if(r===1&&v.eyeIssue)id=pick(compPool.slice(0,Math.min(4,compPool.length)));
      else if(r===1)id=pick(fastIn.length?fastIn:marsPool);
      else id=Math.random()<st.marsShare?pick(marsPool):pick(compPool);
      const n=2+(Math.random()<.4?1:0);
      for(let i=0;i<n&&row.length<cols;i++)row.push(id);
    }
    g.push(row);
  }
  const used=new Set();
  for(const sku of v.oos){
    let r,c,guard=0;
    do{r=pick([0,2,3]);c=2*Math.floor(Math.random()*(cols/2));guard++;}while(used.has(r+'-'+c)&&guard<50);
    used.add(r+'-'+c);g[r][c]='gap:'+sku;g[r][c+1]='gap2';
  }
  return g;
}

function drawBuilding(ctx,t){

function loop(now){
  const dt=Math.min(.05,(now-lastT)/1000);lastT=now;
  if(!CUR||$('#scrStore').hidden){raf=0;return;}
  const W=LAYOUT[CUR].W,sp=320;let moving=false,dir=0;
  if(!$('#overlay').hidden||!$('#pauseWall').hidden){raf=requestAnimationFrame(loop);return;}
  if(keys.l||keys.r){dir=keys.r?1:-1;px+=dir*sp*dt;target=null;pending=null;moving=true;}
  else if(target!=null){const d=target-px;if(Math.abs(d)<4){px=target;target=null;const a=pending;pending=null;if(a)a();}else{dir=Math.sign(d);px+=dir*Math.min(Math.abs(d),sp*dt);moving=true;}}
  px=clamp(px,30,W-30);
  const pl=$('#player');if(pl){pl.classList.toggle('walk',moving);if(dir)pl.classList.toggle('flip',dir<0);}
  place();raf=requestAnimationFrame(loop);
}
function walkTo(x,fn){target=clamp(x,30,LAYOUT[CUR].W-30);pending=fn||null;if(Math.abs(target-px)<4){target=null;pending=null;fn&&fn();}}
function worldX(el){return el.getBoundingClientRect().left-$('#world').getBoundingClientRect().left+el.getBoundingClientRect().width/2;}
$('#world').addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el){walkTo(e.clientX-$('#world').getBoundingClientRect().left);return;}
  const x=worldX(el),act=el.dataset.act,id=el.dataset.id;
  walkTo(act==='pack'||act==='gap'?x:x,()=>interact(act,id,el));
});
$('#world').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const el=e.target.closest('[data-act]');if(el){e.preventDefault();el.click();}}});
function interact(act,id,el){
  const v=G.visits[CUR];
  if(act==='exit')return leaveStore();
  if(act==='owner')return openNego();
  if(act==='pack'){
    const r=+el.dataset.r,m=!!SK[id],p=prodOf(id);
    if(r===1&&!m&&v.eyeIssue&&!v.eyeFound){v.eyeFound=true;toast(tr('eyeLogged',{co:String(p.co||'').split(' ')[0]||p.short}),'good');enterStoreRefresh();save();return;}
    toast(m?`${pName(p)} · ${tr('marsRange')}`:`${p.short} · ${p.co} · ${tr('competitor')}`);return;
  }
  if(act==='gap'){
    const p=prodOf(id);
    if(v.oosFound.includes(id)){toast(tr('alreadyFlagged',{x:pShort(p)}));return;}
    v.oosFound.push(id);toast(tr('oosFlag',{x:pName(p)}),'good');enterStoreRefresh();save();return;
  }
  if(act==='spot')return openPosm(id);
}

/* ---------- negotiation ---------- */
function maxDisc(gross){const p=S().policy;return gross<p.t1?p.d1:gross<p.t2?p.d2:p.d3;}
function calc(n){
  let gross=0,cartons=0;
  for(const s of SKUS){const q=n.qty[s.id]||0;gross+=q*(+s.price||0);cartons+=q;}
  const freeC=n.free?Math.floor(cartons/6):0,freeCost=cartons?freeC*gross/cartons:0,disc=gross*n.disc/100;
  const net=gross-disc-freeCost;
  return{gross,cartons,freeC,freeCost,disc,net,comm:net*S().commission/100};
}
function openNego(){
  const t=CUR,st=ST(t),v=G.visits[t];
  if(v.status!=='open')return;
  if(!v.nego){v.nego={qty:{},disc:0,free:false,terms:0,patience:st.patience,log:[{w:'o',k:'open'}],offers:0};
    const s=prepNote(v);if(s)v.nego.log.push({w:'o',keys:s});}
  renderNego();
}
function prepNote(v){
  const k=[];const placed=Object.values(v.spots);
  if(placed.some(p=>p.grade==='best'))k.push('prepGood');
  if(placed.some(p=>p.grade==='bad'))k.push('prepBad');
  if(v.oosFound.length)k.push('prepShelf');
  return k.length?k:null;
}

function renderNegoKeep(){const sc=$('#overlay').scrollTop;const fid=document.activeElement&&document.activeElement.id;renderNego();$('#overlay').scrollTop=sc;if(fid&&document.getElementById(fid))document.getElementById(fid).focus({preventScroll:true});}
function evaluate(n,v,t){
  const st=ST(t),c=calc(n),f=[];
  if(c.gross<st.min)f.push({k:'low',p:t==='koshk'?0:t==='super'?-1:-2,m:2});
  else if(c.gross>st.max)f.push({k:'high',p:-2,m:2});
  else f.push({k:'low',p:2,m:2});
  f.push({k:'disc',p:n.disc>=st.wantDisc?2:n.disc>0?1:0,m:2});
  f.push({k:'terms',p:n.terms>=st.wantTerms?1:(t==='hyper'?-1:0),m:1});
  if(st.likesFree)f.push({k:'free',p:n.free?1:0,m:1});
  const fast=list(st.fast),fc=fast.filter(id=>n.qty[id]>0).length;
  f.push({k:'fast',p:fc>=Math.min(2,fast.length||2)?1:0,m:1});
  const avoid=list(st.avoid);if(avoid.some(id=>n.qty[id]>0))f.push({k:'avoid',p:-1,m:0});
  const inc=v.oos.filter(id=>n.qty[id]>0).length,miss=v.oos.find(id=>!(n.qty[id]>0));
  f.push({k:'oos',p:inc,m:v.oos.length,sku:miss||''});
  const placed=Object.values(v.spots);
  f.push({k:'prep',p:(placed.some(p=>p.grade==='best')?1:0)-(placed.some(p=>p.grade==='bad')?1:0),m:1});
  if(v.eyeIssue)f.push({k:'eye',p:v.eyeFound?1:0,m:1});
  if(st.needsGondola)f.push({k:'gondola',p:placed.some(p=>p.type==='gondola')?0:-1,m:0});
  const total=f.reduce((a,b)=>a+b.p,0);
  const gaps=f.filter(x=>x.m-x.p>0&&ownerLine(t,x.k)).sort((a,b)=>(b.m-b.p)-(a.m-a.p)||PRIORITY.indexOf(a.k)-PRIORITY.indexOf(b.k));
  return{total,ok:total>=st.need,top:gaps[0],c,f};
}
function policyBreach(n,t){
  const st=ST(t),c=calc(n),p=S().policy;
  if(n.disc>maxDisc(c.gross))return{tk:'brDisc',tv:{d:n.disc,m:maxDisc(c.gross),g:egp(c.gross)}};
  if(n.terms>st.maxTerms)return{tk:'brTerms',tv:{t:termName(n.terms)}};
  if(n.free&&n.disc>p.freeStack)return{tk:'brFree',tv:{x:p.freeStack}};
  return null;
}
function makeOffer(){
  const t=CUR,st=ST(t),v=G.visits[t],n=v.nego,c=calc(n);
  if(!c.cartons){toast(tr('addCarton'),'warn');return;}
  n.log.push({w:'p',tk:'offer',tv:{c:c.cartons,g:egp(c.gross),d:n.disc,t:termName(n.terms),f:n.free?tr('offerFree'):''}});
  n.offers++;
  const br=policyBreach(n,t);
  if(br){
    G.lives--;n.patience--;
    n.log.push({w:'s',tk:'amBlock',tv:{x:tr(br.tk,br.tv)}});
    toast(tr('breachToast'),'bad');renderHud();
    if(G.lives<=0){save(true);return gameOver();}
    if(n.patience<=0)return walkout();
    save();return renderNegoKeep();
  }
  const ev=evaluate(n,v,t);n.lastInterest=clamp(ev.total/st.need,0,1);
  if(ev.ok)return closeDeal(ev);
  n.patience--;
  n.log.push(ev.top?{w:'o',k:ev.top.k,sku:ev.top.sku||''}:{w:'o',tk:'notGood'});
  if(n.patience<=0)return walkout();
  save();renderNegoKeep();
}
function coaching(v,t,n){
  const st=ST(t),L_=LAYOUT[t],out=[];
  const missed=v.oos.filter(x=>!v.oosFound.includes(x)).map(x=>pShort(prodOf(x))).join(LANG==='ar'?'، ':', ');
  out.push({k:missed?'bad':'good',tk:missed?'cOosMiss':'cOos',tv:{f:v.oosFound.length,n:v.oos.length,x:missed}});
  if(v.eyeIssue)out.push({k:v.eyeFound?'good':'bad',tk:v.eyeFound?'cEyeYes':'cEyeNo'});
  for(const sp of L_.spots){const p=v.spots[sp.id];
    if(!p){out.push({k:'warn',tk:'cUnused',tv:{s:sp.id,b:sp.best.join('|')},spot:sp.id});continue;}
    out.push({k:p.grade==='best'?'good':p.grade==='ok'?'warn':'bad',tk:p.grade==='best'?'cBest':p.grade==='ok'?'cOk':'cBad',spot:sp.id,posm:p.type});}
  if(n&&n.offers)out.push({k:'warn',tk:'cExpect'});
  return out;
}
function closeDeal(ev){
  const t=CUR,v=G.visits[t],n=v.nego,s=S();
  const audit=s.auditBonus*(v.oosFound.length+(v.eyeFound?1:0));
  const comm=Math.round(ev.c.comm);
  v.status='won';v.earned=comm+audit;G.money+=comm+audit;G.earned+=comm+audit;G.deals++;
  n.log.push({w:'o',k:'accept'});
  v.coach=coaching(v,t,n);
  G.history.push({day:G.day,store:t,result:'won',net:Math.round(ev.c.net),earned:v.earned});
  save(true);renderHud();
  showResult(true,t,{net:ev.c.net,comm,audit});
}
function walkout(){
  const t=CUR,st=ST(t),v=G.visits[t];
  v.status='failed';G.lives--;v.coach=coaching(v,t,v.nego);
  G.history.push({day:G.day,store:t,result:'lost'});
  renderHud();save(true);
  if(G.lives<=0)return gameOver();
  showResult(false,t,{});
}

function prodOf(id){return SK[id]||CP[id]||{short:id,name:id,co:'?',bg:'#9aa0b5',fg:'#fff'};}
function msgText(m,t){
  if(m.k)return ownerLine(t,m.k).replace('{sku}',m.sku?pShort(prodOf(m.sku)):tr('thatProduct'))||tr('notGood');
  if(m.keys)return m.keys.map(k=>tr(k)).join(' ');
  if(m.tk)return tr(m.tk,m.tv||{});
  return m.t||'';
}
function coachText(c,t){
  const st=ST(t),sp=c.spot?LAYOUT[t].spots.find(s=>s.id===c.spot):null;
  if(c.t&&!c.tk)return c.t;
  const v=Object.assign({},c.tv||{});
  if(sp){v.s=spLabel(sp);v.b=sp.best.map(b=>posmName(b)).join(' / ');v.tip=spTip(sp);if(c.posm)v.p=posmName(c.posm);}

  return tr(c.tk,v);
}

  if(t.id==='addProd'){ADM.draft.products.push({id:'p'+Math.random().toString(36).slice(2,8),name:'New product',short:'New',pack:'24 pcs',price:600,bg:'#0000A0',fg:'#ffffff'});markDirty();rerenderScen();return;}
  if(t.id==='addComp'){ADM.draft.competitors.push({id:'c'+Math.random().toString(36).slice(2,8),short:'Brand',co:'Company',bg:'#888888',fg:'#ffffff'});markDirty();rerenderScen();return;}
  const dp=t.closest('[data-delprod]');if(dp){const p=ADM.draft.products.splice(+dp.dataset.delprod,1)[0];for(const s of TYPES){for(const k of ['fast','avoid'])ADM.draft.stores[s][k]=list2(ADM.draft.stores[s][k]).filter(x=>x!==p.id).join(',');}markDirty();rerenderScen();return;}
  const dc=t.closest('[data-delcomp]');if(dc){ADM.draft.competitors.splice(+dc.dataset.delcomp,1);markDirty();rerenderScen();return;}
  const ch=t.closest('[data-chip]');if(ch){const path=ch.dataset.chip,[,st,key]=path.split('.');const cur=list2(ADM.draft.stores[st][key]);const id=ch.dataset.id;const nx=cur.includes(id)?cur.filter(x=>x!==id):[...cur,id];ADM.draft.stores[st][key]=nx.join(',');ch.setAttribute('aria-pressed',!cur.includes(id));markDirty();return;}
  if(t.id==='csvBtn'){const rows=[['Rank','Team','Scenario','Day','Deals','Lives','Wallet EGP','Status']].concat([...TEAMS].sort((a,b)=>(b.money||0)-(a.money||0)).map((x,i)=>[i+1,x.name,scenName(x.scenarioId||'cairo-standard'),x.day||1,x.deals||0,x.lives??'',Math.round(x.money||0),x.status||'playing']));
    const csv=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
    try{await navigator.clipboard.writeText(csv);toast(tr('csvDone'),'good');}catch(err){const ta=document.createElement('textarea');ta.value=csv;ta.style.cssText='width:100%;height:160px;margin-top:10px';$('#admBody .card').appendChild(ta);ta.select();toast(tr('csvManual'),'warn');}return;}
  const rs=t.closest('[data-reset]'),dl=t.closest('[data-del]'),rv=t.closest('[data-revive]');
  if(rv){ADM.confirm={kind:'revive',id:rv.dataset.revive};renderAdmTeams();return;}
  if(rs||dl){ADM.confirm={kind:rs?'reset':'del',id:(rs||dl).dataset[rs?'reset':'del']};renderAdmTeams();return;}
  const yes=t.closest('[data-yes]');
  if(yes){const id=yes.dataset.yes,tm=TEAMS.find(x=>x.id===id),kind=ADM.confirm.kind;
    try{
      if(kind==='reset'){const keepT=TEAM,keepG=G;TEAM={id,name:tm.name,color:tm.color,scenarioId:EVENT.activeScenario};const g=newGame();TEAM=keepT;G=keepG;
        const body={state:g,money:g.money,lives:g.lives,day:1,deals:0,earned:0,status:'playing',scenarioId:EVENT.activeScenario,updatedAt:Date.now()};
        if(db)await db.doc('teams/'+id).update(body);else{Object.assign(tm,body);saveLocalTeams();}}
      else if(kind==='revive'){const lives=buildScenario(SCEN[tm.scenarioId]||null).lives;const st=JSON.parse(JSON.stringify(tm.state||{}));st.lives=lives;st.over=false;
        if(st.visits){for(const k of TYPES){const v=st.visits[k];if(v&&v.status==='failed'&&v.nego){v.nego.patience=1;}}}
        const body={state:st,lives,status:'playing',updatedAt:Date.now()};
        if(db)await db.doc('teams/'+id).update(body);else{Object.assign(tm,body);saveLocalTeams();}}
      else{if(db)await db.doc('teams/'+id).delete();else{TEAMS=TEAMS.filter(x=>x.id!==id);saveLocalTeams();}}
      toast(tr({reset:'teamRestarted',del:'teamRemoved',revive:'teamRevived'}[kind]),'good');
    }catch(err){toast(tr('notAllowed'),'bad');}
    ADM.confirm=null;renderAdmTeams();return;}
});
function list2(s){return String(s||'').split(',').map(x=>x.trim()).filter(Boolean);}
function markDirty(){ADM.dirty=true;ADM.leaveOk=false;updateSaveBar();}
$('#scrAdmin').addEventListener('change',e=>{
  if(e.target.id==='sc-pick'){if(ADM.dirty){toast(tr('saveFirst'),'warn');e.target.value=ADM.scen;return;}loadDraft(e.target.value);ADM.confirm=null;renderAdmScen();return;}
  const f=e.target.closest('[data-f]');if(!f)return;
  let v=f.value;if(f.dataset.t==='bool')v=v==='1';else if(f.dataset.t==='num')v=parseFloat(v)||0;
  setPath(ADM.draft,f.dataset.f,v);markDirty();
  const m=f.dataset.f.match(/^(products|competitors)\.(\d+)\.(short|bg|fg)$/);
  if(m){const row=f.closest('.prow'),prev=row&&row.querySelector('.pk-prev'),it=ADM.draft[m[1]][+m[2]];if(prev){prev.textContent=it.short||'?';prev.style.background=it.bg;prev.style.color=it.fg;}}
  if(/^stores\.\w+\.(name|owner)(_ar)?$/.test(f.dataset.f)){const det=f.closest('details'),[,st]=f.dataset.f.split('.');det.querySelector('summary b').textContent=L(ADM.draft.stores[st],'name');det.querySelector('summary .muted').textContent=L(ADM.draft.stores[st],'owner');}
});
async function saveScenario(){
  const d=ADM.draft;
  for(const t of TYPES){const s=d.stores[t];if(+s.min>=+s.max){toast(tr('minMax',{x:s.name}),'bad');return;}}
  if(!d.products.length){toast(tr('needProd'),'bad');return;}
  try{const body=JSON.parse(JSON.stringify(d));delete body.prices;await adminWrite('scenarios/'+ADM.scen,body);SCEN[ADM.scen]=body;ADM.dirty=false;updateSaveBar();renderLobby();toast(tr('scenSaved'),'good');}
  catch(err){toast(tr('saveFail'),'bad');}
}
addEventListener('beforeunload',e=>{if(ADM.dirty){e.preventDefault();e.returnValue='';}});
async function adminWrite(path,body){if(!db)throw new Error('offline');await db.doc(path).set(JSON.parse(JSON.stringify(body)));}

/* ---------- boot ---------- */
$('#langBtn').addEventListener('click',()=>setLang(LANG==='ar'?'en':'ar'));
applyLang();renderLobby();renderHud();
initBackend().then(()=>{if(location.hash==='#admin'&&isAdmin)openAdmin();});
</script>
